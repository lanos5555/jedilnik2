<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Malice – Femec, Vinka, Rotonda, Atrio 151</title>
  <link rel="preconnect" href="https://femec-proxy.lanos5555.workers.dev" crossorigin>
  <link rel="preconnect" href="https://api.allorigins.win" crossorigin>
  <link rel="preconnect" href="https://r.jina.ai" crossorigin>
  <link rel="preconnect" href="https://api.codetabs.com" crossorigin>

  <style>
    :root{
      --primary-bg: #ffffff;
      --secondary-bg: #f8fafc;
      --card-bg: #ffffff;
      --surface-bg: #f1f5f9;

      --primary-text: #0f172a;
      --secondary-text: #475569;
      --tertiary-text: #64748b;
      --muted-text: #94a3b8;

      --border-light: #e2e8f0;
      --border-medium: #cbd5e1;
      --border-dark: #94a3b8;

      --accent-blue: #3b82f6;
      --accent-blue-light: #eff6ff;
      --accent-green: #10b981;
      --accent-green-light: #ecfdf5;
      --accent-amber: #f59e0b;
      --accent-amber-light: #fffbeb;
      --accent-red: #ef4444;
      --accent-red-light: #fef2f2;
      --accent-purple: #8b5cf6;
      --accent-pink: #ec4899;

      --day-monday: var(--accent-purple);
      --day-tuesday: var(--accent-blue);
      --day-wednesday: var(--accent-green);
      --day-thursday: var(--accent-amber);
      --day-friday: var(--accent-pink);

      --shadow-sm: 0 1px 2px 0 rgba(0,0,0,.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,.10), 0 2px 4px -1px rgba(0,0,0,.06);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.10), 0 4px 6px -2px rgba(0,0,0,.05);
      --shadow-xl: 0 20px 25px -5px rgba(0,0,0,.10), 0 10px 10px -5px rgba(0,0,0,.04);

      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-2xl: 20px;
      --radius-full: 9999px;

      --transition-fast: 150ms ease;
      --transition-normal: 250ms ease;

      --header-height: 72px;
      --max-width: 1400px;

      /* ENOTEN STIL CEN (vsi ponudniki) */
      --price: var(--accent-amber);

      --tap: 44px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(59,130,246,.07), transparent 30%),
        radial-gradient(circle at 88% 8%, rgba(16,185,129,.05), transparent 26%),
        #f7f9fc;
      color: var(--primary-text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x:hidden;
    }
    a{ color: inherit; text-decoration:none; }

    .wrap{
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 28px 24px 40px;
    }

    .topbar{
      position: sticky;
      top: 0;
      z-index: 20;
      height: var(--header-height);
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(16px) saturate(140%);
      border-bottom: 1px solid rgba(226,232,240,.8);
      box-shadow: 0 6px 24px rgba(15,23,42,.045);
      display:flex;
      align-items:center;
    }
    .topbarInner{
      max-width: var(--max-width);
      margin: 0 auto;
      width:100%;
      padding: 0 24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 22px;
      flex-wrap:wrap;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      flex-shrink:0;
      min-width: 0;
    }
    .logo{
      width:44px; height:44px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3b82f6 0%, #14b8a6 100%);
      display:flex; align-items:center; justify-content:center;
      box-shadow: 0 8px 20px rgba(59,130,246,.22);
      flex:0 0 auto;
    }
    .logo span{
      font-size: 20px;
      font-weight: 900;
      color: #fff;
      line-height: 1;
    }

    .titleBox{ min-width:0; }
    .titleBox h1{
      margin:0;
      font-size: 21px;
      font-weight: 850;
      color: var(--primary-text);
      line-height: 1.2;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .titleBox p{
      margin: 2px 0 0;
      font-size: 14px;
      color: #718096;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .actions{
      display:flex;
      align-items:center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content:flex-end;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-light);
      background: var(--accent-blue-light);
      color: var(--accent-blue);
      font-size: 14px;
      font-weight: 650;
      white-space:nowrap;
      max-width:100%;
    }
    .pill b{ font-weight: 800; color: var(--accent-blue); }

    #globalStatus.pill{
      background: var(--accent-green-light);
      color: var(--accent-green);
    }
    #globalStatus.pill b{ color: var(--accent-green); }

    .btn{
      cursor:pointer;
      border: none;
      border-radius: var(--radius-full);
      height: var(--tap);
      padding: 0 20px;
      font-weight: 600;
      font-size: 14px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap: 8px;
      transition: all var(--transition-fast);
      white-space:nowrap;
    }
    .btn{
      background: linear-gradient(135deg,#3b82f6,#2563eb);
      color: #fff;
      box-shadow: 0 8px 18px rgba(37,99,235,.18);
    }
    .btn:hover{ background:#2563eb; transform: translateY(-1px); box-shadow: var(--shadow-lg); }
    .btn.secondary{
      background: var(--primary-bg);
      color: var(--secondary-text);
      border: 1px solid #dce4ee;
      box-shadow: 0 2px 6px rgba(15,23,42,.025);
    }
    .btn.secondary:hover{ background: var(--surface-bg); border-color: var(--border-dark); transform:none; box-shadow:none; }
    .btn:disabled{ opacity:.5; cursor:not-allowed; transform:none !important; }

    .hero{
      margin-bottom: 24px;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
      display:block;
    }
    .heroRight{ margin-top: 14px; display:block; }

    .searchWrap{
      display:flex;
      align-items:center;
      gap: 10px;
      padding: 0;
      border:0;
      background: transparent;
      flex-wrap: nowrap;
      position: relative;
    }
    .searchIcon{
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--tertiary-text);
      font-size: 18px;
      pointer-events:none;
    }
    .searchWrap input{
      width: 100%;
      padding: 16px 48px 16px 48px;
      border: 1px solid #dfe6ef;
      border-radius: 16px;
      background: rgba(255,255,255,.94);
      color: var(--primary-text);
      font-size: 16px;
      font-weight: 500;
      transition: all var(--transition-normal);
      box-shadow: 0 6px 18px rgba(15,23,42,.045);
      outline: none;
    }
    .searchWrap input:focus{
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 4px rgba(59,130,246,.10), 0 10px 24px rgba(59,130,246,.08);
    }
    .searchWrap input::placeholder{
      color: var(--muted-text);
      font-weight: 400;
    }

    .clearBtn{
      position:absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      color: var(--tertiary-text);
      font-size: 18px;
      display:none;
      align-items:center;
      justify-content:center;
      padding:0;
    }
    .clearBtn:hover{ background: var(--surface-bg); color: var(--secondary-text); }
    .clearBtn.show{ display:flex; }

    .chips{
      display:flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }
    .chips::-webkit-scrollbar{ height: 6px; }
    .chips::-webkit-scrollbar-track{ background: var(--surface-bg); border-radius: var(--radius-full); }
    .chips::-webkit-scrollbar-thumb{ background: var(--border-medium); border-radius: var(--radius-full); }

    .chip{
      cursor:pointer;
      border: 1px solid #dfe6ef;
      background: rgba(255,255,255,.92);
      color: #475569;
      border-radius: 12px;
      padding: 10px 18px;
      font-weight: 600;
      font-size: 14px;
      user-select:none;
      transition: all var(--transition-fast);
      white-space: nowrap;
    }
    .chip:hover{ border-color:#93c5fd; color:#2563eb; background:#f8fbff; transform:translateY(-1px); }
    .chip.active{
      background: var(--accent-blue);
      color: #fff;
      border-color: var(--accent-blue);
    }
    .chip.active:nth-child(1){ background: var(--day-monday); border-color: var(--day-monday); }
    .chip.active:nth-child(2){ background: var(--day-tuesday); border-color: var(--day-tuesday); }
    .chip.active:nth-child(3){ background: var(--day-wednesday); border-color: var(--day-wednesday); }
    .chip.active:nth-child(4){ background: var(--day-thursday); border-color: var(--day-thursday); }
    .chip.active:nth-child(5){ background: var(--day-friday); border-color: var(--day-friday); }

    .grid{
      display:grid;
      gap: 20px;
      grid-template-columns: repeat(1, minmax(0,1fr));
    }
    @media (min-width: 768px){
      .grid{ grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (min-width: 1200px){
      .grid{ grid-template-columns: repeat(4, minmax(0,1fr)); }
    }

    .res{
      background: var(--card-bg);
      border-radius: 24px;
      border: 1px solid rgba(226,232,240,.95);
      overflow:hidden;
      box-shadow: 0 10px 30px rgba(15,23,42,.065);
      position:relative;
      transition: box-shadow var(--transition-normal), transform var(--transition-normal);
      display:flex;
      flex-direction:column;
      min-width:0;
    }
    .res:hover{ box-shadow: 0 18px 42px rgba(15,23,42,.11); transform: translateY(-3px); }
    .res::before{
      content:"";
      position:absolute;
      left:0; top:0; right:0;
      height:4px;
      z-index:2;
      background:linear-gradient(90deg,#3b82f6,#60a5fa);
    }
    #vinkaWidget::before{ background:linear-gradient(90deg,#10b981,#34d399); }
    #rotondaWidget::before{ background:linear-gradient(90deg,#8b5cf6,#a78bfa); }
    #atrioWidget::before{ background:linear-gradient(90deg,#f59e0b,#fb923c); }


    .resHead{
      padding: 24px 20px 18px;
      border-bottom: 1px solid #edf1f5;
      background: linear-gradient(180deg,#ffffff 0%,#fcfdff 100%);
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }

    .resName{
      margin:0;
      font-size: 20px;
      font-weight: 800;
      color: var(--primary-text);
      display:flex;
      align-items:center;
      gap: 8px;
      flex-wrap: wrap;
      line-height: 1.2;
    }
    .resName a:hover{ color: #2563eb; }

    .badge{
      display:inline-flex;
      align-items:center;
      gap: 6px;
      padding: 7px 11px;
      border-radius: 10px;
      background: #f3f7ff;
      color: #2563eb;
      border: 1px solid #dbeafe;
      font-size: 12px;
      font-weight: 700;
      white-space:nowrap;
      letter-spacing:.01em;
    }
    .hoursBadge::before{
      content:"";
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--accent-green);
      box-shadow:0 0 0 3px rgba(16,185,129,.10);
      flex:0 0 auto;
    }

    .meta{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap: 12px;
      min-width: 0;
      flex: 0 0 auto;
    }
    .metaRow{
      display:flex;
      gap: 8px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
      width: 100%;
    }
    .status{
      display:inline-flex;
      align-items:center;
      gap: 6px;
      padding: 8px 12px;
      background: #f8fafc;
      color: #475569;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border-light);
      white-space:nowrap;
      min-width: 0;
      text-align: center;
    }
    .updated{
      font-size: 11px;
      color: #94a3b8;
      text-align:right;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 340px;
    }

    .resBody{
      padding: 18px 20px 22px;
      display:flex;
      flex-direction:column;
      gap: 18px;
    }

    .panel{ padding: 0; border:0; background:transparent; }

    .panelTitle{
      margin: 0 0 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      flex-wrap:wrap;
    }
    .panelTitle b{
      font-size: 14px;
      font-weight: 800;
      text-transform:uppercase;
      color: var(--primary-text);
      letter-spacing:.01em;
    }

    .dayTag{
      display:inline-flex;
      align-items:center;
      gap: 6px;
      padding: 7px 11px;
      background: #f8fafc;
      color: #475569;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border-light);
    }
    .dayTag small{
      color: var(--tertiary-text);
      font-weight: 500;
    }

    /* NASLOVI SEKCII (Vinka + Femec + Mooi) */
    .sectionHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      background: linear-gradient(90deg,#eff6ff 0%,#f8fbff 100%);
      border: 1px solid #dbeafe;
      color: #1d4ed8;
      font-weight: 800;
      font-size: 12px;
      letter-spacing:.055em;
      text-transform: uppercase;
      margin: 0 0 12px;
    }
    .sectionHeader small{
      color: var(--accent-blue);
      font-weight: 700;
      opacity: .9;
    }

    .dish{
      padding: 15px;
      border-radius: 16px;
      background: #ffffff;
      border: 1px solid #e7ecf2;
      margin: 0 0 10px;
      box-shadow: 0 2px 8px rgba(15,23,42,.028);
      transition: background var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast);
    }
    .dish:hover{ background:#fff; border-color:#cfd9e6; transform:translateY(-2px); box-shadow:0 8px 18px rgba(15,23,42,.06); }

    .dishRow{
      display:grid;
      grid-template-columns: 32px 1fr auto;
      gap: 12px;
      align-items:start;
    }

    .num{
      width: 32px; height: 32px;
      border-radius: 10px;
      background: linear-gradient(180deg,#f8fbff,#eef4ff);
      color: #2563eb;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 700;
      font-size: 14px;
      border: 1px solid var(--border-light);
    }

    .dishTitle{
      margin:0;
      font-size: 14px;
      font-weight: 600;
      color: var(--primary-text);
      line-height: 1.4;
      letter-spacing: 0;
    }
    .dishText{
      margin: 4px 0 0;
      font-size: 14px;
      color: var(--tertiary-text);
      line-height: 1.5;
      white-space: pre-line;
    }

    /* CENE: povsod oranžne in isti stil */
    .priceCol{
      font-weight: 800;
      color: #f59e0b;
      text-align: right;
      min-width: 72px;
      font-size: 15px;
      padding-top: 0;
      white-space: nowrap;
    }
    .priceCol .pLine{ display:block; }

    .hit{
      background: rgba(245,158,11,.20);
      padding: 2px 4px;
      border-radius: var(--radius-sm);
      color: var(--accent-amber);
      font-weight: 600;
    }

    .muted{ color: var(--tertiary-text); margin:0; }

    .err{
      background: var(--accent-red-light);
      border: 1px solid var(--border-light);
      padding: 14px 16px;
      border-radius: var(--radius-lg);
      color: var(--accent-red);
      font-weight: 600;
    }

    .loader{
      display:flex;
      gap: 10px;
      align-items:center;
      padding: 12px 0;
      color: var(--tertiary-text);
      justify-content:center;
    }
    .dot{
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent-blue);
      animation: b 1.4s infinite ease-in-out both;
      opacity: .8;
    }
    .dot:nth-child(1){ animation-delay: -0.32s; }
    .dot:nth-child(2){ animation-delay: -0.16s; }
    @keyframes b{
      0%,80%,100%{ transform: scale(.8); opacity: .5; }
      40%{ transform: scale(1); opacity: 1; }
    }

    .imgGrid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    @media (min-width: 640px){
      .imgGrid{ grid-template-columns: repeat(2, 1fr); }
    }

    .imgCard{
      border-radius: var(--radius-lg);
      overflow:hidden;
      border: 1px solid var(--border-light);
      cursor: pointer;
      transition: all var(--transition-normal);
      position:relative;
      background: var(--primary-bg);
    }
    .imgCard:hover{
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
      border-color: var(--accent-blue);
    }
    .imgCard img{ width:100%; height:auto; display:block; }

    .imgCap{
      position:absolute;
      bottom: 12px;
      left: 12px;
      padding: 6px 12px;
      background: rgba(255,255,255,.95);
      backdrop-filter: blur(4px);
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 600;
      color: var(--primary-text);
      border: 1px solid var(--border-light);
    }

    .modal{
      position:fixed;
      inset:0;
      z-index: 60;
      display:none;
      align-items:center;
      justify-content:center;
      padding: 24px;
      background: rgba(0,0,0,.85);
      backdrop-filter: blur(8px);
    }
    .modal.show{ display:flex; animation: fadeIn 150ms ease-out; }

    .modalPanel{
      max-width: 1000px;
      width:100%;
      max-height: 90vh;
      border-radius: var(--radius-2xl);
      border: 1px solid rgba(255,255,255,.10);
      background: var(--primary-bg);
      box-shadow: var(--shadow-xl);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      animation: slideUp 200ms ease-out;
    }
    .modalTop{
      padding: 20px;
      border-bottom: 1px solid var(--border-light);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
    }
    .modalTop b{
      font-weight: 700;
      color: var(--primary-text);
      font-size: 18px;
    }
    .modalClose{
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      border: none;
      background: transparent;
      color: var(--tertiary-text);
      font-size: 20px;
      cursor:pointer;
      transition: all var(--transition-fast);
    }
    .modalClose:hover{ background: var(--surface-bg); color: var(--primary-text); }

    .modalImgWrap{
      overflow:auto;
      background: var(--primary-bg);
      flex: 1 1 auto;
    }
    .modalImgWrap img{ display:block; width:100%; height:auto; }

    @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
    @keyframes slideUp{ from{ opacity:0; transform: translateY(20px);} to{opacity:1; transform: translateY(0);} }

    .toast{
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--primary-text);
      color: #fff;
      padding: 14px 20px;
      border-radius: var(--radius-lg);
      font-weight: 600;
      font-size: 14px;
      box-shadow: var(--shadow-xl);
      z-index: 70;
      opacity: 0;
      pointer-events:none;
      transition: all var(--transition-normal);
      max-width: 90%;
      text-align:center;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      display:block;
    }
    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events:none;
    }

    @media (max-width: 768px){
      .topbarInner{ padding: 0 16px; }
      .wrap{ padding: 16px; }
      #todayPill{ display:none; }
      .resHead{ flex-direction: column; align-items:flex-start; }
      .meta{ align-items:flex-start; width:100%; }
      .metaRow{ justify-content:flex-start; }
      .updated{ text-align:left; max-width: 100%; }
    }
    @media (max-width: 480px){
      .dishRow{ grid-template-columns: 1fr; gap: 8px; }
      .priceCol{ text-align:left; }
      .num{ display:inline-flex; }
    }
    @media (prefers-reduced-motion: reduce){
      *{ animation:none !important; transition:none !important; scroll-behavior:auto !important; }
    }
  
    @media (max-width: 767px){
      .wrap{ padding:18px 14px 30px; }
      .topbar{ height:auto; min-height:72px; padding:10px 0; }
      .topbarInner{ padding:0 14px; }
      .actions{ gap:8px; }
      .resHead{ padding:22px 16px 16px; }
      .resBody{ padding:16px; }
      .resName{ font-size:20px; }
      .dish{ padding:13px; }
      .dishRow{ grid-template-columns:30px 1fr auto; gap:10px; }

<script>
(() => {
  const FEMEC_PROXY_URL   = "https://femec-proxy.lanos5555.workers.dev/api/femec";

  const ROTONDA_SOURCE_URL = "https://www.rotonda.si/bistro";
  const ATRIO_PROXY_URL   = "https://femec-proxy.lanos5555.workers.dev/api/atrio";
  const VINKA_SOURCE_URL  = "https://www.vinka.si/malice-in-kosila.html";
  const ATRIO_SOURCE_URL  = "https://atrio151.si/";
  const ATRIO_CACHE_DATA_KEY = "atrio:v1:data";
  const ATRIO_CACHE_TS_KEY = "atrio:v1:ts";
  const ALLORIGINS_RAW_URL = "https://api.allorigins.win/raw?url=";
  const JINA_READER_URL = "https://r.jina.ai/";
  const CODETABS_PROXY_URL = "https://api.codetabs.com/v1/proxy/?quest=";

  const FETCH_TIMEOUT_MS = 8500;

  const FEMEC_TIMEOUT_MS = 8500;
  const FEMEC_RETRIES = 1;

  const VINKA_TIMEOUT_MS = 15000;

  const ROTONDA_TIMEOUT_MS = 2500;
  const ROTONDA_RETRIES = 1;

  const CLICK_COOLDOWN_MS = 3500;

  const DAYS = [
    { key:"ponedeljek", label:"Ponedeljek" },
    { key:"torek",      label:"Torek" },
    { key:"sreda",      label:"Sreda" },
    { key:"cetrtek",    label:"Četrtek" },
    { key:"petek",      label:"Petek" },
  ];

  const DAY_EN_TO_SI = {
    MONDAY: "ponedeljek",
    TUESDAY: "torek",
    WEDNESDAY: "sreda",
    THURSDAY: "cetrtek",
    FRIDAY: "petek"
  };

  let globalDayKey = getDefaultDayKey();
  let globalQuery = "";

  const $ = (id) => document.getElementById(id);
  const now = () => Date.now();

  function bust(u){
    if (!u) return u;
    return u + (u.includes("?") ? "&" : "?") + "v=" + Date.now();
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[m]));
  }
  function escapeRegExp(s){
    return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }
  function highlightQueryEscaped(escapedText, query){
    const q = (query || "").trim();
    if (!q) return escapedText;
    const tokens = q.split(/\s+/).map(t => t.trim()).filter(t => t.length >= 2);
    if (!tokens.length) return escapedText;
    let out = escapedText;
    for (const tok of tokens){
      const re = new RegExp(escapeRegExp(tok), "gi");
      out = out.replace(re, (m) => `<span class="hit">${m}</span>`);
    }
    return out;
  }
  function decorateText(text){
    const escaped = escapeHtml(text || "");
    return highlightQueryEscaped(escaped, globalQuery);
  }

  function setLoading(el, msg){
    el.innerHTML = `<div class="loader">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span>${escapeHtml(msg || "Nalaganje…")}</span>
    </div>`;
  }
  function setError(el, msg){
    el.innerHTML = `<div class="err">${escapeHtml(msg)}</div>`;
  }
  function sourceLabel(source){
    const raw = String(source || "").toLowerCase();
    const labels = {
      "worker/direct":"Worker · direct",
      "worker/allorigins":"Worker · AllOrigins",
      "worker/codetabs":"Worker · CodeTabs",
      "worker/jina":"Worker · Jina",
      "worker/browser":"Worker · Browser",
      "worker/unknown":"Worker",
      "worker":"Worker",
      "direct":"Direct",
      "allorigins":"AllOrigins",
      "codetabs":"CodeTabs",
      "jina":"Jina",
      "cache":"Cache"
    };
    return labels[raw] || source || "";
  }

  function setUpdated(el, ts, source="", note=""){
    const d = new Date(ts || Date.now());
    const time = d.toLocaleTimeString("sl-SI", { hour:"2-digit", minute:"2-digit" });
    const parts = [time];

    if (source) parts.push(sourceLabel(source));

    if (note){
      const compactNote = String(note)
        .replace(/^meni:\s*/i, "meni ")
        .replace(/(ponedeljek|torek|sreda|četrtek|cetrtek|petek)[,\s]*/i, "")
        .replace(/(\d{1,2})\.\s*(januar|februar|marec|april|maj|junij|julij|avgust|september|oktober|november|december)/i, (m,d,mn) => {
          const map = {januar:1,februar:2,marec:3,april:4,maj:5,junij:6,julij:7,avgust:8,september:9,oktober:10,november:11,december:12};
          return `${d}. ${map[mn.toLowerCase()] || mn}.`;
        });
      parts.push(compactNote);
    }

    el.textContent = parts.join(" · ");
    el.title = `Preverjeno ${time}${source ? ` · Vir: ${sourceLabel(source)}` : ""}${note ? ` · ${note}` : ""}`;
    el.hidden = false;

    const isCache = String(source || "").toLowerCase() === "cache";
    el.classList.toggle("fromCache", isCache);
  }

  function getDefaultDayKey(){
    const d = new Date();
    const wd = d.getDay();
    if (wd >= 1 && wd <= 5) return DAYS[wd-1].key;
    return "ponedeljek";
  }

  function formatDateForDayKey(dayKey){
    const idxMap = { ponedeljek:1, torek:2, sreda:3, cetrtek:4, petek:5 };
    const idx = idxMap[dayKey] || 1;
    const d = new Date();
    let wd = d.getDay(); if (wd === 0) wd = 7;
    const monday = new Date(d); monday.setDate(d.getDate() - (wd-1));
    const target = new Date(monday); target.setDate(monday.getDate() + (idx-1));
    return target.toLocaleDateString("sl-SI", { day:"numeric", month:"long" });
  }

  function timestampForDayKey(dayKey){
    const idxMap = { ponedeljek:1, torek:2, sreda:3, cetrtek:4, petek:5 };
    const idx = idxMap[dayKey] || 1;
    const d = new Date();
    let wd = d.getDay(); if (wd === 0) wd = 7;
    const monday = new Date(d);
    monday.setHours(0,0,0,0);
    monday.setDate(d.getDate() - (wd - 1));
    const target = new Date(monday);
    target.setDate(monday.getDate() + (idx - 1));
    return target.getTime();
  }

  function withCooldown(buttons, ms){
    const list = Array.isArray(buttons) ? buttons : [buttons];
    list.forEach(b => { if (b) b.disabled = true; });
    setTimeout(() => list.forEach(b => { if (b) b.disabled = false; }), ms);
  }

  function makeSingleFlight(loader){
    let inflight = null;
    return async (...args) => {
      if (inflight) return inflight;
      inflight = (async () => {
        try { return await loader(...args); }
        finally { inflight = null; }
      })();
      return inflight;
    };
  }

  async function fetchTextWithTimeout(url, timeoutMs){
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeoutMs ?? FETCH_TIMEOUT_MS);
    try{
      const resp = await fetch(url, {
        signal: ctrl.signal,
        cache: "no-store",
        headers:{ "Accept":"text/html,*/*" }
      });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      return await resp.text();
    } finally { clearTimeout(t); }
  }

  async function fetchTextWithRetry(url, { retries = 0, timeoutMs = FETCH_TIMEOUT_MS } = {}){
    let last;
    for (let i=0; i<=retries; i++){
      try { return await fetchTextWithTimeout(url, timeoutMs ?? FETCH_TIMEOUT_MS); }
      catch(e){ last = e; if (i < retries) await new Promise(r => setTimeout(r, 300*(i+1))); }
    }
    throw last;
  }

  async function fetchWorkerHtml(
    url,
    {
      timeoutMs = FETCH_TIMEOUT_MS,
      cacheBust = true,
      cacheMode = "no-store"
    } = {}
  ){
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeoutMs);

    try{
      const requestUrl = cacheBust
        ? url + (url.includes("?") ? "&" : "?") + "_cb=" + Date.now()
        : url;

      const resp = await fetch(requestUrl, {
        signal: ctrl.signal,
        cache: cacheMode,
        headers:{ "Accept":"text/html,*/*" }
      });

      if (!resp.ok) throw new Error("HTTP " + resp.status);

      const html = await resp.text();
      const source = (resp.headers.get("X-Menu-Source") || "").toLowerCase();

      // Strogo pravilo: lastgood ni potrjeno aktualen in ga ne smemo prikazati.
      if (source === "lastgood"){
        throw new Error("Worker je vrnil lastgood, ne potrjeno aktualnega menija.");
      }

      return {
        html,
        source: source || "unknown"
      };
    } finally {
      clearTimeout(t);
    }
  }

  function norm(s){ return String(s || "").toLowerCase().trim(); }
  function includesQuery(text, q){
    if (!q) return true;
    return norm(text).includes(norm(q));

  function splitPriceLines(price){
    const p = String(price || "").trim();
    if (!p) return [];
    const parts = p.split(/\s*\/\s*/).map(x => x.trim()).filter(Boolean);
    return parts.length ? parts : [p];

  function renderDishList(el, list, {

  // ==============================
  // FEMEC
  // ==============================
  const femec = (() => {
    const elStatus = $("statusFemec");
    const elUpdated = $("updatedFemec");
    const elRefresh = $("refreshFemec");
    const elBody = $("femecBody");

    let parsed = null;

    function extractWeeklyItemsFromPs(ps){
      if (!ps || !ps.length) return [];
      const lines = ps
        .map(s => String(s || "").replace(/\u00a0/g, " ").trim())
        .filter(s => s && s !== "&nbsp;");

      const idxStart = lines.findIndex(l => /tedenska\s+ponudba/i.test(l));
      if (idxStart === -1) return [];

      const after = lines.slice(idxStart + 1).filter(l => !/tedenska\s+ponudba/i.test(l));

      const items = [];
      let curNum = null;
      let curParts = [];

      const pushCur = () => {
        if (!curNum) return;
        const text = curParts.join(" ").replace(/\s+/g, " ").trim();
        if (text) items.push({ num: String(curNum), title: text, details: [], price: "" });
      };

      for (const raw of after){
        const m = raw.match(/^\s*(\d+)\.\s*(.*)\s*$/);
        if (m){
          pushCur();
          curNum = Number(m[1]);
          const rest = (m[2] || "").trim();
          curParts = rest ? [rest] : [];
        } else {
          if (curNum != null) curParts.push(raw);
        }
      }
      pushCur();

      return items;
    }

    function parseFemecMenu(html){
      const doc = new DOMParser().parseFromString(html, "text/html");
      const root = doc.querySelector("#wholemenu") || doc;
      const out = {};

      for (const d of DAYS){
        const sec = root.querySelector(`#${d.key}`) || doc.getElementById(d.key);
        if (!sec) { out[d.key] = { daily:[], weekly:[] }; continue; }

        const lines = Array.from(sec.querySelectorAll(".menuline"));

        const daily = [];
        let weekly = [];

        for (const line of lines){
          const num = (line.querySelector(".menunumber")?.textContent || "").trim();

          const ps = Array.from(line.querySelectorAll(".menucontent p"))
            .map(p => (p.textContent || "").replace(/\u00a0/g," ").trim())
            .filter(Boolean);

          if (!ps.length) continue;

          const wk = extractWeeklyItemsFromPs(ps);
          if (wk.length){
            weekly = wk;
            continue;
          }

          const name = (ps[0] || "").replace(/\s+/g," ").trim();
          const sides = ps.slice(1).filter(x => x && x !== "\u00a0");
          if (!name) continue;

          daily.push({ num, title: name, details: sides, price: "" });
        }

        out[d.key] = { daily, weekly };
      }
      return out;
    }

    function filterForQuery(list){
      if (!globalQuery) return list;
      return (list || []).filter(d => {
        const blob = [d.num, d.title, Array.isArray(d.details) ? d.details.join(" ") : d.details].join(" ");
        return includesQuery(blob, globalQuery);
      });
    }

    function render(){
      const day = parsed?.[globalDayKey] || { daily:[], weekly:[] };
      const daily = filterForQuery(day.daily || []);
      const weekly = filterForQuery(day.weekly || []);

      let html = "";

      html += `<div class="sectionHeader">Dnevna ponudba</div>`;
      html += daily.length
        ? renderDishCardsHtml(daily.map(x => ({ title:x.title, details:x.details, price:"" })), { startIndex: 1 })
        : (globalQuery ? `<p class="muted">Ni zadetkov za iskanje.</p>` : `<p class="muted">Meni še ni na voljo.</p>`);

      if (weekly.length){
        html += `<div class="sectionHeader" style="margin-top:14px">Stalna ponudba</div>`;
        html += weekly.map(w => ({
          title: w.title,
          details: [],
          price: "",
          _num: w.num
        })).map((d) => {
          return `
            <div class="dish">
              <div class="dishRow">
                <span class="num">${escapeHtml(String(d._num || ""))}</span>
                <div>
                  <div class="dishTitle">${decorateText(d.title || "")}</div>
                </div>
                <div class="priceCol"></div>
              </div>
            </div>
          `;
        }).join("");
      }

      elBody.innerHTML = html;
    }

    const load = makeSingleFlight(async (force=false) => {
      setLoading(elBody, force ? "Osvežujem Femec…" : "Nalagam Femec…");
      elStatus.textContent = force ? "Osvežujem…" : "Nalaganje…";

      try {
        const result = await fetchWorkerHtml(FEMEC_PROXY_URL, { timeoutMs: FEMEC_TIMEOUT_MS });
        parsed = parseFemecMenu(result.html);
        elStatus.textContent = "Posodobljeno";
        setUpdated(elUpdated, now(), `worker/${result.source}`);
        render();
      } catch (e) {
        setError(elBody, "Femec meni ni dosegljiv.");
        elStatus.textContent = "Napaka";
        console.error(e);
      }
    });

    elRefresh.addEventListener("click", () => {
      withCooldown(elRefresh, CLICK_COOLDOWN_MS);
      load(true);
      toast("Osvežujem: Femec");
    });

    return { load, render, refreshBtn: elRefresh };
  })();

  // ==============================
  // VINKA
  // ==============================
  const vinka = (() => {
    const elStatus = $("statusVinka");
    const elUpdated = $("updatedVinka");
    const elRefresh = $("refreshVinka");
    const elBody = $("vinkaBody");

    let vinkaData = null;
    let lastGoodTs = 0;

    function cleanHtmlToText(htmlSnippet){
      const withBreaks = String(htmlSnippet || "")
        .replace(/<br\s*\/?>/gi, "\n")
        .replace(/<\/(?:p|div|li|h[1-6])>/gi, "\n");
      const parsed = new DOMParser().parseFromString(withBreaks, "text/html");
      return (parsed.body?.textContent || "")
        .replace(/\u00a0/g, " ")
        .replace(/\r/g, "")
        .replace(/[ \t]+\n/g, "\n")
        .replace(/\n{3,}/g, "\n\n")
        .trim();
    }

    function parseVinka(html){
      const doc = new DOMParser().parseFromString(html, "text/html");
      const content =
        doc.querySelector('div.col-md-9[role="content"]') ||
        doc.querySelector("main") ||
        doc.querySelector('[role="main"]') ||
        doc.body;
      if (!content) return { ok:false, dailyLines:[], regularLines:[], sourceDate:"", msg:"Glavni vsebinski del ni bil najden." };

      const headingDate = Array.from(content.querySelectorAll("h1,h2,h3,h4"))
        .map(el => (el.textContent || "").replace(/\s+/g, " ").trim())
        .find(text => /^(ponedeljek|torek|sreda|četrtek|cetrtek|petek)\b/i.test(text)) || "";
      const contentText = cleanHtmlToText(content.innerHTML);
      const textDate = contentText
        .split("\n")
        .map(line => line.replace(/^#+\s*/, "").trim())
        .find(text => /^(ponedeljek|torek|sreda|četrtek|cetrtek|petek)\b/i.test(text)) || "";
      const sourceDate = headingDate || textDate;

      let pWithMenu = null;
      for (const p of Array.from(content.querySelectorAll("p"))) {
        const t = (p.textContent || "").toLocaleLowerCase("sl-SI");
        if (t.includes("dnevna ponudba") && (t.includes("naše stalnice") || t.includes("jed na žlico") || t.includes("za vegeterijance") || t.includes("za vegetarijance"))) {
          pWithMenu = p; break;
        }
      }
      // Če Vinka razdeli meni med več odstavkov, preglej celoten vsebinski del.
      const htmlContent = (pWithMenu || content).innerHTML;
      const menuText = cleanHtmlToText(htmlContent);
      const menuLower = menuText.toLocaleLowerCase("sl-SI");

      function marker(labels){
        for (const label of labels){
          const index = menuLower.indexOf(label.toLocaleLowerCase("sl-SI"));
          if (index !== -1) return { index, length:label.length };
        }
        return { index:-1, length:0 };
      }

      const mStal = marker(["Naše stalnice:"]);
      const mDnev = marker(["Dnevna ponudba:"]);
      const mVeg  = marker(["Za vegeterijance:", "Za vegetarijance:"]);
      const mZlic = marker(["Jed na žlico:"]);

      let dailyText = "";
      let regularText = "";

      if (mStal.index === -1 || mDnev.index === -1) {
        return { ok:false, dailyLines:[], regularLines:[], sourceDate, msg:"Vsebina menija ni v pričakovani obliki." };
      } else {
        const dailyEnd = (mVeg.index !== -1)
          ? mVeg.index
          : ((mZlic.index !== -1) ? mZlic.index : menuText.length);
        dailyText = menuText.substring(mDnev.index + mDnev.length, dailyEnd).trim();
        regularText = menuText.substring(mStal.index + mStal.length, mDnev.index).trim();
      }

      const dailyLines = dailyText ? dailyText.split("\n").map(s => s.trim()).filter(Boolean) : [];
      const regularLines = regularText ? regularText.split("\n").map(s => s.trim()).filter(Boolean) : [];
      if (!dailyLines.length && !regularLines.length) {
        return { ok:false, dailyLines:[], regularLines:[], sourceDate, msg:"Na strani ni bilo mogoče prebrati jedi." };
      }
      return { ok:true, dailyLines, regularLines, sourceDate, msg:"" };
    }

    const SLO_MONTHS = {
      januar:0, februar:1, marec:2, april:3, maj:4, junij:5,
      julij:6, avgust:7, september:8, oktober:9, november:10, december:11
    };

    function sourceDateTimestamp(sourceDate){
      const match = String(sourceDate || "").toLocaleLowerCase("sl-SI")
        .match(/(\d{1,2})\.\s*(januar|februar|marec|april|maj|junij|julij|avgust|september|oktober|november|december)/i);
      if (!match) return 0;

      const current = new Date();
      let year = current.getFullYear();
      const month = SLO_MONTHS[match[2]];
      const day = Number(match[1]);
      const candidate = new Date(year, month, day);

      // Pravilen prehod med decembrom in januarjem.
      const diff = candidate.getTime() - current.getTime();
      if (diff > 180 * 24 * 60 * 60 * 1000) year--;
      if (diff < -180 * 24 * 60 * 60 * 1000) year++;

      return new Date(year, month, day).getTime();
    }

    function isTodaySourceDate(sourceDate){
      const ts = sourceDateTimestamp(sourceDate);
      return Boolean(ts) && startOfDay(ts) === startOfDay(Date.now());
    }

    function isSourceDateCurrentWeek(sourceDate){
      const ts = sourceDateTimestamp(sourceDate);
      if (!ts) return false;

      const nowDate = new Date();
      let wd = nowDate.getDay();
      if (wd === 0) wd = 7;

      const monday = new Date(nowDate);
      monday.setHours(0,0,0,0);
      monday.setDate(nowDate.getDate() - (wd - 1));

      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      sunday.setHours(23,59,59,999);

      return ts >= monday.getTime() && ts <= sunday.getTime();
    }

    function isVinkaFreshForDisplay(){
      const ts = sourceDateTimestamp(vinkaData?.sourceDate);
      if (!ts) return false;
      return startOfDay(ts) === startOfDay(timestampForDayKey(globalDayKey));
    }

    async function fetchBestVinka(){
      // Vinka se zdaj pridobiva izključno prek našega Workerja.
      // Worker uporablja Browser Run in sam preveri, da je datum menija današnji.
      // Starih javnih proxyjev (AllOrigins/CodeTabs/Jina) ne kličemo več,
      // ker so počasni in so pri Vinki vračali blokirane ali zastarele rezultate.
      const result = await fetchWorkerHtml(VINKA_PROXY_URL, {
        timeoutMs: VINKA_TIMEOUT_MS,
        // Stabilen URL je nujen, da lahko 12-sekundni Worker/browser cache zadene.
        // Vinka Worker sam strogo preveri današnji datum pred cacheiranjem.
        cacheBust: false,
        cacheMode: "default"
      });

      const parsed = parseVinka(result.html);
      if (!parsed.ok){
        throw new Error(parsed.msg || "Vinka: menija ni bilo mogoče razčleniti.");
      }

      if (!isTodaySourceDate(parsed.sourceDate)){
        throw new Error(
          `Worker ni vrnil današnjega Vinkinega menija: ${parsed.sourceDate || "brez datuma"}.`
        );
      }

      return {
        ...parsed,
        source: `worker/${result.source}`,
        sourceTs: sourceDateTimestamp(parsed.sourceDate)
      };
    }

    async function fetchBestVinkaWithRetry(){
      // Samo en klic Workerja na posamezno osveževanje.
      // Browser Run ima lahko omejitve pogostosti, zato hiter avtomatski retry
      // povzroči več škode kot koristi (naslednji klic lahko takoj dobi 502).
      return await fetchBestVinka();
    }

    function startOfDay(ts){
      const d = new Date(ts);
      d.setHours(0,0,0,0);
      return d.getTime();
    }

    function isFutureSelectedDay(){
      const idxMap = { ponedeljek:1, torek:2, sreda:3, cetrtek:4, petek:5 };
      const idx = idxMap[globalDayKey] || 1;

      const d = new Date();
      let wd = d.getDay(); if (wd === 0) wd = 7;
      const monday = new Date(d); monday.setDate(d.getDate() - (wd-1));
      const target = new Date(monday); target.setDate(monday.getDate() + (idx-1));

      return startOfDay(target.getTime()) > startOfDay(Date.now());
    }

    function filterLines(lines){
      if (!globalQuery) return lines || [];
      return (lines || []).filter(line => includesQuery(line, globalQuery));
    }

    function splitLineAndPrice(line){
      const s = String(line || "").trim();

      let m = s.match(/^(.*?)(?:\s+)(\d{1,3}(?:[.,]\d{1,2})?)\s*(?:€|eur)\s*$/i);
      if (m) return { title: m[1].trim(), price: (m[2].replace(".", ",") + "€") };

      m = s.match(/^(.*?)(?:\s+)?(\d{1,3}(?:[.,]\d{1,2})?)\s*€\s*$/i);
      if (m) return { title: m[1].trim(), price: (m[2].replace(".", ",") + "€") };

      m = s.match(/^€\s*(\d{1,3}(?:[.,]\d{1,2})?)\s*(.*)$/);
      if (m) return { title: (m[2] || "").trim() || s, price: (m[1].replace(".", ",") + "€") };

      return { title: s, price: "" };
    }

    function linesToItems(lines){
      return (lines || []).map(l => {
        const sp = splitLineAndPrice(l);
        return { title: sp.title, details: [], price: sp.price };
      });
    }

    function render(){
      if (!vinkaData){
        elBody.innerHTML = `<p class="muted">Meni še ni na voljo.</p>`;
        return;
      }

      // Vinkin vir je dnevni. Če je objavljen meni iz prejšnjega tedna,
      // ga ne smemo prikazati kot aktualnega.
      if (!isVinkaFreshForDisplay()){
        elBody.innerHTML = `
          <div class="err">
            Aktualnega Vinkinega menija za izbrani dan ni mogoče potrditi.
            ${vinkaData?.sourceDate ? `Zadnji uspešno pridobljeni meni: ${escapeHtml(vinkaData.sourceDate)}.` : ""}
          </div>
        `;
        return;
      }

      if (isFutureSelectedDay()){
        elBody.innerHTML = `<p class="muted">Meni še ni na voljo.</p>`;
        return;
      }

      const dailyLines = filterLines(vinkaData.dailyLines);
      const regularLines = filterLines(vinkaData.regularLines);

      const dailyItems = linesToItems(dailyLines);
      const regularItems = linesToItems(regularLines);

      if (!dailyItems.length && !regularItems.length){
        elBody.innerHTML = globalQuery
          ? `<p class="muted">Ni zadetkov za iskanje.</p>`
          : `<p class="muted">Meni še ni na voljo.</p>`;
        return;
      }

      let html = "";

      if (dailyItems.length){
        html += `<div class="sectionHeader">Dnevna ponudba</div>`;
        html += renderDishCardsHtml(dailyItems, { startIndex: 1 });
      }

      if (regularItems.length){
        html += `<div class="sectionHeader">Stalna ponudba</div>`;
        html += renderDishCardsHtml(regularItems, { startIndex: 1 });
      }

      elBody.innerHTML = html;
    }

    const load = makeSingleFlight(async (force=false) => {
      if (vinkaData && isVinkaFreshForDisplay()){
        render();
        elStatus.textContent = "Preverjam aktualnost…";
      } else {
        setLoading(elBody, force ? "Osvežujem Vinka…" : "Nalagam Vinka…");
        elStatus.textContent = force ? "Osvežujem…" : "Nalaganje…";
      }
      let refreshError = "";

      try {
        const p = await fetchBestVinkaWithRetry();

        // Dodatna varovalka: v cache in prikaz sme samo današnji Vinkin meni.
        if (!isTodaySourceDate(p.sourceDate)){
          throw new Error(`Vinka je vrnila zastarel meni: ${p.sourceDate || "brez datuma"}.`);
        }

        const incomingTs = p.sourceTs || 0;
        const currentTs = sourceDateTimestamp(vinkaData?.sourceDate);

        // Počasnejši ali zastarel posrednik ne sme prepisati novejšega menija.
        if (!currentTs || !incomingTs || incomingTs >= currentTs) {
          vinkaData = {
            dailyLines:p.dailyLines,
            regularLines:p.regularLines,
            sourceDate:p.sourceDate || "",
            source:p.source
          };
          lastGoodTs = Date.now();

        }

        elStatus.textContent = vinkaData?.sourceDate
          ? (isVinkaFreshForDisplay() ? `Meni: ${vinkaData.sourceDate}` : `Ni aktualnega menija`)
          : "Posodobljeno";
        setUpdated(
          elUpdated,
          lastGoodTs || now(),
          vinkaData?.source || p.source,
          vinkaData?.sourceDate ? `meni: ${vinkaData.sourceDate}` : ""
        );
        render();
        return;
      } catch (error) {
        refreshError = error?.message || "Neznana napaka.";
        console.error("Vinka refresh failed", error);
      }

      // Če imamo v pomnilniku že potrjen današnji meni, ga ob začasni
      // napaki Browser Run ne izbrišemo. Tako uporabnik ne vidi rdeče napake
      // samo zato, ker je kasnejše preverjanje začasno spodletelo.
      if (vinkaData && isTodaySourceDate(vinkaData.sourceDate)){
        elStatus.textContent = "Aktualno · preverjanje začasno ni uspelo";
        render();
        if (refreshError) console.warn("Vinka preverjanje:", refreshError);
        return;
      }

      setError(
        elBody,
        "Aktualnega Vinkinega menija trenutno ni mogoče potrditi. Poskusi osvežiti čez nekaj trenutkov."
      );
      elStatus.textContent = "Ni potrjeno";
      if (refreshError) console.warn("Vinka viri:", refreshError);
    });

    elRefresh.addEventListener("click", () => {
      withCooldown(elRefresh, CLICK_COOLDOWN_MS);
      load(true);
      toast("Osvežujem: Vinka");
    });

    // Ob zagonu ne prikazujemo lokalno shranjene Vinka vsebine.
    // Vedno počakamo na sveže, datumsko potrjeno vsebino Workerja.
    render();

    return { load, render, refreshBtn: elRefresh };
  })();

  const rotonda = (() => {
    const elStatus = $("statusRotonda");
    const elUpdated = $("updatedRotonda");
    const elRefresh = $("refreshRotonda");
    const elBody = $("rotondaBody");

    let parsedByDay = null;

    function normalizeLines(text){
      const fixed = (text || "")
        .replace(/\u00a0/g, " ")
        .replace(/Weekly menu\s*(\d)/gi, "Weekly menu\n$1")
        .replace(/(MONDAY|TUESDAY|WEDNESDAY|THURSDAY|FRIDAY)\s*(\/)\s*(MONDAY|TUESDAY|WEDNESDAY|THURSDAY|FRIDAY)/gi, "$1 / $3");
      return fixed
        .split("\n")
        .map(s => s.replace(/\s+/g, " ").trim())
        .filter(Boolean);
    }

    function canonicalDayLine(line){
      return (line || "").replace(/[^A-Za-z/ ]/g, "").replace(/\s+/g, " ").trim().toUpperCase();
    }
    function isDayHeadingLine(line){
      const s = canonicalDayLine(line);
      return /^(MONDAY|TUESDAY|WEDNESDAY|THURSDAY|FRIDAY)(\s*\/\s*(MONDAY|TUESDAY|WEDNESDAY|THURSDAY|FRIDAY))*$/.test(s);
    }
    function dayHeadingToKeys(line){
      const s = canonicalDayLine(line);
      const parts = s.split("/").map(x => x.trim()).filter(Boolean);
      return parts.map(p => DAY_EN_TO_SI[p]).filter(Boolean);
    }
    function looksLikePrice(s){ return /^€\s*\d/.test(s) || /^€\d/.test(s); }
    function looksLikeWeekRange(s){ return /^\d{1,2}\s*-\s*\d{1,2}\s+[A-Za-z]/.test(s); }
    function isJunkTitle(s){
      const t = (s || "").trim();
      if (!t) return true;
      if (t === "/" || t === "-" || t === "—") return true;
      if (!/[A-Za-zÀ-ž]/.test(t)) return true;
      const low = t.toLowerCase();
      if (low.startsWith("with ")) return true;
      if (low.startsWith("optional")) return true;
      if (low === "side salad" || low === "with side salad") return true;
      if (low.includes("subscribe")) return true;
      if (low.includes("newsletter")) return true;
      if (low.includes("sign up")) return true;
      if (low.includes("email address")) return true;
      if (low === "thank you!") return true;
      return false;
    }

    function rotondaCurrentWeek(raw){
      const doc = new DOMParser().parseFromString(String(raw || ""), "text/html");
      const text = doc.body ? (doc.body.innerText || doc.body.textContent || "") : String(raw || "");
      const clean = text.replace(/\u00a0/g, " ").replace(/\s+/g, " ").trim();

      const months = {
        january:0, february:1, march:2, april:3, may:4, june:5,
        july:6, august:7, september:8, october:9, november:10, december:11
      };

      const now = new Date();
      now.setHours(12,0,0,0);

      function inRange(startDay, startMonth, endDay, endMonth){
        const years = [now.getFullYear()-1, now.getFullYear(), now.getFullYear()+1];

        for (const y of years){
          let sy = y;
          let ey = y;

          if (endMonth < startMonth) ey = y + 1;

          const start = new Date(sy, startMonth, startDay, 0,0,0,0);
          const end = new Date(ey, endMonth, endDay, 23,59,59,999);

          if (now >= start && now <= end) return true;
        }
        return false;
      }

      // Primer: 6 - 10 July
      let m = clean.match(/\b(\d{1,2})\s*[-–]\s*(\d{1,2})\s+(January|February|March|April|May|June|July|August|September|October|November|December)\b/i);
      if (m){
        const month = months[m[3].toLowerCase()];
        return inRange(Number(m[1]), month, Number(m[2]), month);
      }

      // Primer: 28 September - 2 October
      m = clean.match(/\b(\d{1,2})\s+(January|February|March|April|May|June|July|August|September|October|November|December)\s*[-–]\s*(\d{1,2})\s+(January|February|March|April|May|June|July|August|September|October|November|December)\b/i);
      if (m){
        return inRange(
          Number(m[1]),
          months[m[2].toLowerCase()],
          Number(m[3]),
          months[m[4].toLowerCase()]
        );
      }

      return false;
    }

    function rotondaHasItems(data){
      return !!data && Object.values(data).some(list => Array.isArray(list) && list.length > 0);
    }

    async function fetchRotondaVerified(){
      // Najprej naš Worker. Če že ta vrne pravilen aktualni meni,
      // ni razloga čakati na počasnejše rezervne proxyje.
      try{
        const worker = await fetchWorkerHtml(ROTONDA_PROXY_URL, { timeoutMs: ROTONDA_TIMEOUT_MS });
        const parsed = parseRotonda(worker.html);

        if (rotondaCurrentWeek(worker.html) && rotondaHasItems(parsed)){
          return { parsed, source:`worker/${worker.source}` };
        }
      }catch(e){
        console.warn("Rotonda Worker ni uspel, preverjam rezervne vire.", e);
      }

      // Worker ni uspel ali ni vseboval potrjenega aktualnega tedna.
      // Jina se je pri Rotondi izkazala kot najhitrejši rezervni vir,
      // zato jo preverimo najprej. Počasnejše proxyje kličemo samo po potrebi.
      const token = Date.now() + "-" + Math.random().toString(36).slice(2);
      const direct = ROTONDA_SOURCE_URL + "?_cb=" + encodeURIComponent(token);

      const sources = [
        {
          name:"jina",
          run: () => fetchTextWithRetry(
            JINA_READER_URL + ROTONDA_SOURCE_URL,
            { retries:0, timeoutMs:3500 }
          )
        },
        {
          name:"codetabs",
          run: () => fetchTextWithRetry(
            CODETABS_PROXY_URL + encodeURIComponent(direct),
            { retries:0, timeoutMs:5000 }
          )
        },
        {
          name:"allorigins",
          run: () => fetchTextWithRetry(
            ALLORIGINS_RAW_URL + encodeURIComponent(direct) + "&_cb=" + encodeURIComponent(token),
            { retries:0, timeoutMs:5000 }
          )
        }
      ];

      for (const source of sources){
        try{
          const raw = await source.run();
          const parsed = parseRotonda(raw);

          if (!rotondaCurrentWeek(raw) || !rotondaHasItems(parsed)){
            throw new Error(`${source.name}: vir nima potrjenega aktualnega tedna.`);
          }

          return { parsed, source:source.name };
        }catch(error){
          console.warn(`Rotonda ${source.name} ni uspel.`, error);
        }
      }

      throw new Error("Aktualnega Rotonda menija trenutno ni mogoče potrditi.");
    }

    function parseRotonda(html){
      const doc = new DOMParser().parseFromString(html, "text/html");
      const fullText = doc.body
        ? (doc.body.innerText || doc.body.textContent || "")
        : (doc.documentElement?.textContent || "");
      const lines = normalizeLines(fullText);

      const startIdx = lines.findIndex(l => l.toLowerCase() === "weekly menu");
      const endIdx = lines.findIndex((l, idx) => {
        if (idx <= startIdx) return false;
        const low = l.toLowerCase();
        return low.includes("subscribe") || low.includes("newsletter") || low.includes("sign up");
      });

      const slice = (startIdx !== -1)
        ? lines.slice(startIdx + 1, endIdx !== -1 ? endIdx : lines.length)
        : lines;

      let i = 0;
      if (slice.length && looksLikeWeekRange(slice[0])) i = 1;

      const out = {
        ponedeljek:[],
        torek:[],
        sreda:[],
        cetrtek:[],
        petek:[]
      };

      let activeDays = [];

      const priceKey = (value) =>
        String(value || "")
          .replace(/\s+/g, "")
          .replace(/,/g, ".")
          .toLowerCase();

      while (i < slice.length){
        const line = slice[i];

        if (isDayHeadingLine(line)){
          activeDays = dayHeadingToKeys(line);
          i++;
          continue;
        }

        if (!activeDays.length || !looksLikePrice(line)){
          i++;
          continue;
        }

        let price = line.trim();
        const openingPriceKey = priceKey(price);
        i++;

        let title = "";
        const details = [];

        while (i < slice.length){
          const current = slice[i];

          if (isDayHeadingLine(current)){
            break;
          }

          if (looksLikePrice(current)){
            const currentPriceKey = priceKey(current);

            // Rotondin Squarespace HTML pogosto vsebuje isto ceno dvakrat:
            // enkrat pred jedjo in še enkrat za mobilni/desktop prikaz.
            // Enako ponovljeno ceno zato preskočimo in nadaljujemo z opisi.
            if (currentPriceKey === openingPriceKey){
              i++;
              continue;
            }

            // Drugačna cena pomeni začetek naslednje jedi.
            break;
          }

          const text = current.trim();
          i++;

          if (!text || text === "/" || text === "-" || text === "—"){
            continue;
          }

          if (!title){
            if (isJunkTitle(text)) continue;
            title = text;
            continue;
          }

          // Dodatne vrstice (with side salad, optional..., pre-order...)
          // pripadajo isti jedi, tudi če je bila vmes v HTML ponovljena cena.
          if (!/^(weekly menu)$/i.test(text)){
            details.push(text);
          }
        }

        if (!title || isJunkTitle(title)){
          continue;
        }

        // Odstrani podvojene zaporedne opise, ki jih lahko Squarespace
        // ustvari zaradi ločenega desktop/mobile markupa.
        const cleanDetails = [];
        for (const detail of details){
          if (!cleanDetails.length || cleanDetails[cleanDetails.length - 1] !== detail){
            cleanDetails.push(detail);
          }
        }

        const dish = {
          title,
          price,
          details: cleanDetails
        };

        for (const dayKey of activeDays){
          out[dayKey].push({
            title:dish.title,
            price:dish.price,
            details:[...dish.details]
          });
        }
      }

      return out;
    }

    function filterForQuery(list){
      if (!globalQuery) return list;
      return (list || []).filter(d => {
        const blob = [d.title, d.price, Array.isArray(d.details) ? d.details.join(" ") : d.details].join(" ");
        return includesQuery(blob, globalQuery);
      });
    }

    function render(){
      const listRaw = (parsedByDay?.[globalDayKey] || []).filter(d => {
        const blob = [d?.title, ...(Array.isArray(d?.details) ? d.details : [])]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();
        return !(
          blob.includes("subscribe") ||
          blob.includes("newsletter") ||
          blob.includes("sign up") ||
          blob.includes("email address") ||
          blob.includes("thank you")
        );
      });
      const list = filterForQuery(listRaw);

      let html = `<div class="sectionHeader">Dnevna ponudba</div>`;

      if (!list.length){
        html += globalQuery
          ? `<p class="muted">Ni zadetkov za iskanje.</p>`
          : `<p class="muted">Meni še ni na voljo.</p>`;
        elBody.innerHTML = html;
        return;
      }

      html += renderDishCardsHtml(list, { startIndex:1 });
      elBody.innerHTML = html;
    }

    const load = makeSingleFlight(async (force=false) => {
      setLoading(
        elBody,
        force
          ? "Preverjam aktualni Rotonda meni…"
          : "Nalagam in preverjam aktualni Rotonda meni…"
      );
      elStatus.textContent = "Preverjam aktualnost…";

      try{
        const verified = await fetchRotondaVerified();
        parsedByDay = verified.parsed;

        elStatus.textContent = "Aktualno";
        setUpdated(elUpdated, now(), verified.source);
        render();
      } catch(e){
        parsedByDay = null;
        setError(elBody, "Aktualnega Rotonda menija trenutno ni mogoče potrditi.");
        elStatus.textContent = "Ni potrjeno";
        console.error(e);
      }
    });

    elRefresh.addEventListener("click", () => {
      withCooldown(elRefresh, CLICK_COOLDOWN_MS);
      load(true);
      toast("Osvežujem: Rotonda");
    });

    return { load, render, refreshBtn: elRefresh };
  })();

  // ==============================
  // ATRIO 151
  // ==============================
  const atrio = (() => {
    const elStatus = $("statusAtrio");
    const elUpdated = $("updatedAtrio");
    const elRefresh = $("refreshAtrio");
    const elBody = $("atrioBody");

    let parsed = {
      breakfast: [],
      lunchByDay: { ponedeljek:[], torek:[], sreda:[], cetrtek:[], petek:[] },
      regular: []
    };

    function readAtrioCache(){
      try{
        const raw = localStorage.getItem(ATRIO_CACHE_DATA_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        const ts = Number(localStorage.getItem(ATRIO_CACHE_TS_KEY) || 0);
        return { data, ts };
      }catch(e){
        return null;
      }
    }

    function writeAtrioCache(data){
      try{
        localStorage.setItem(ATRIO_CACHE_DATA_KEY, JSON.stringify(data));
        localStorage.setItem(ATRIO_CACHE_TS_KEY, String(Date.now()));
      }catch(e){}
    }

    function atrioCacheLooksCurrent(data){
      if (!data) return false;
      const total = (data.breakfast?.length || 0) +
        (data.regular?.length || 0) +
        Object.values(data.lunchByDay || {}).reduce((n, arr) => n + (arr?.length || 0), 0);
      return total > 0;
    }

    function cleanLines(raw){
      const doc = new DOMParser().parseFromString(String(raw || ""), "text/html");
      const text = doc.body ? (doc.body.innerText || doc.body.textContent || "") : String(raw || "");
      return text
        .replace(/\u00a0/g, " ")
        .replace(/\r/g, "")
        .split("\n")
        .map(x => x.replace(/^#+\s*/, "").replace(/\s+/g, " ").trim())
        .filter(Boolean);
    }

    function isPrice(line){
      return /\d{1,3}(?:[.,]\d{1,2})?\s*€/i.test(String(line || ""));
    }

    function splitPrice(line){
      const m = String(line || "").match(/^(.*?)(\d{1,3}(?:[.,]\d{1,2})?\s*€(?:\s*\/\s*\d{1,3}(?:[.,]\d{1,2})?\s*€)*)\s*$/i);
      if (!m) return { text:String(line || "").trim(), price:"" };
      return { text:m[1].trim(), price:m[2].trim() };
    }

    function dayKey(line){
      const t = String(line || "").toLocaleLowerCase("sl-SI");
      if (t.startsWith("ponedeljek")) return "ponedeljek";
      if (t.startsWith("torek")) return "torek";
      if (t.startsWith("sreda")) return "sreda";
      if (t.startsWith("četrtek") || t.startsWith("cetrtek")) return "cetrtek";
      if (t.startsWith("petek")) return "petek";
      return "";
    }

    function looksLikeDay(line){
      return /^(ponedeljek|torek|sreda|četrtek|cetrtek|petek)\b/i.test(String(line || ""));
    }

    function sectionStart(lines, labels){
      return lines.findIndex(l => labels.some(x => l.toLocaleLowerCase("sl-SI") === x.toLocaleLowerCase("sl-SI")));
    }

    function toItems(lines){
      const out = [];
      let buffer = [];

      const flush = (price="") => {
        if (!buffer.length) return;
        out.push({
          title: buffer[0],
          details: buffer.slice(1),
          price: String(price || "").trim()
        });
        buffer = [];
      };

      for (const raw of lines){
        const line = String(raw || "").trim();
        if (!line) continue;

        // Samostojna cena: "9,60 €" ali "7 / 7,50 €".
        const priceOnly = line.match(/^((?:\d{1,3}(?:[.,]\d{1,2})?)(?:\s*\/\s*\d{1,3}(?:[.,]\d{1,2})?)*)\s*€$/i);
        if (priceOnly){
          flush(priceOnly[1].replace(/\s+/g, " ") + " €");
          continue;
        }

        // Cena na koncu iste vrstice kot jed.
        const inline = line.match(/^(.*?)\s+((?:\d{1,3}(?:[.,]\d{1,2})?)(?:\s*\/\s*\d{1,3}(?:[.,]\d{1,2})?)*)\s*€$/i);
        if (inline){
          if (inline[1].trim()) buffer.push(inline[1].trim());
          flush(inline[2].replace(/\s+/g, " ") + " €");
          continue;
        }

        buffer.push(line);
      }

      // Element brez cene na koncu ni zanesljivo jed; ga ne dodajamo.
      return out.filter(x => x.title && x.price);
    }

    function atrioSourceWeekTs(raw){
      const lines = cleanLines(raw);
      const nowDate = new Date();
      let wd = nowDate.getDay(); if (wd === 0) wd = 7;

      const monday = new Date(nowDate);
      monday.setHours(0,0,0,0);
      monday.setDate(nowDate.getDate() - (wd - 1));

      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      sunday.setHours(23,59,59,999);

      let newest = 0;
      for (const line of lines){
        const m = line.match(/^(?:ponedeljek|torek|sreda|četrtek|cetrtek|petek)\s+(\d{1,2})\.\s*(\d{1,2})\.?/i);
        if (!m) continue;

        let year = nowDate.getFullYear();
        const candidate = new Date(year, Number(m[2]) - 1, Number(m[1]));
        const diff = candidate.getTime() - nowDate.getTime();
        if (diff > 180 * 24 * 60 * 60 * 1000) year--;
        if (diff < -180 * 24 * 60 * 60 * 1000) year++;
        const ts = new Date(year, Number(m[2]) - 1, Number(m[1])).getTime();
        if (ts > newest) newest = ts;
      }

      return {
        newest,
        currentWeek: newest >= monday.getTime() && newest <= sunday.getTime()
      };
    }

    function parseAtrio(raw){
      const lines = cleanLines(raw);
      const out = {
        breakfast: [],
        lunchByDay: { ponedeljek:[], torek:[], sreda:[], cetrtek:[], petek:[] },
        regular: []
      };

      // Na strani so najprej trije gumbi (Zajtrk / Dnevno kosilo / Stalna ponudba),
      // nato dejanske jedi za zajtrk in šele nato tedenski meni.
      const lunchMarker = lines.findIndex(l =>
        /meni za kosilo se osveži vsak ponedeljek/i.test(l)
      );

      if (lunchMarker === -1) return out;

      // ZAJTRK:
      // poiščemo zadnji navigacijski napis pred markerjem tedenskega kosila.
      let breakfastStart = -1;
      for (let i = 0; i < lunchMarker; i++){
        if (/^(zajtrk|dnevno kosilo|stalna ponudba)(?:\s*[·•].*)?$/i.test(lines[i])){
          breakfastStart = i;
        }
      }
      const breakfastLines = lines.slice(breakfastStart + 1, lunchMarker);
      out.breakfast = toItems(breakfastLines);

      // DNEVNA KOSILA:
      // vsak dan ima trenutno 4 jedi. Pri petku se takoj za četrto jedjo
      // nadaljuje stalna ponudba, zato preostanek ločimo.
      const dayStarts = [];
      for (let i = lunchMarker + 1; i < lines.length; i++){
        if (looksLikeDay(lines[i])){
          dayStarts.push({ index:i, key:dayKey(lines[i]) });
        }
      }

      let regularStartLine = -1;

      for (let d = 0; d < dayStarts.length; d++){
        const cur = dayStarts[d];
        const nextIndex = dayStarts[d + 1]?.index ?? lines.length;
        const rawDayLines = lines.slice(cur.index + 1, nextIndex);
        const items = toItems(rawDayLines);

        if (cur.key === "petek" && items.length > 4){
          out.lunchByDay[cur.key] = items.slice(0, 4);

          // Za stalno ponudbo uporabimo preostale že pravilno razčlenjene jedi.
          out.regular = items.slice(4);
          regularStartLine = cur.index;
        } else {
          out.lunchByDay[cur.key] = items;
        }
      }

      // Odstrani morebitne elemente naslednjih sekcij strani, ki niso jedi.
      const junk = /^(03\s*[—-]\s*Dogodki|Atrio po urah|04\s*[—-]\s*Ure|Kdaj in kje|Delovni čas|Lokacija|Rezervacije)/i;
      out.regular = (out.regular || []).filter(item =>
        item?.title && !junk.test(item.title)
      );

      // Varnostna omejitev: stalna ponudba je pred sekcijo "03 — Dogodki".
      // Če je parser zaradi strukture HTML zajel preveč, obdrži le realne jedi s ceno.
      out.regular = out.regular.filter(item => item.price);

      return out;
    }

    function countItems(data){
      return (data.breakfast?.length || 0) +
        (data.regular?.length || 0) +
        Object.values(data.lunchByDay || {}).reduce((n, arr) => n + (arr?.length || 0), 0);
    }

    async function fetchAtrio(){
      // 1) GLAVNI VIR: naš Cloudflare Worker
      try{
        const worker = await fetchWorkerHtml(ATRIO_PROXY_URL, { timeoutMs: 10000 });
        const data = parseAtrio(worker.html);
        const week = atrioSourceWeekTs(worker.html);

        if (countItems(data) > 0 && week.currentWeek){
          return { data, source:`worker/${worker.source}` };
        }

        throw new Error("Atrio Worker ni vrnil potrjenega menija aktualnega tedna.");
      }catch(workerError){
        console.warn("Atrio Worker ni uspel, preverjam rezervne vire.", workerError);
      }

      // 2) REZERVNI VIRI: dovoljeni samo, če vsebina potrjeno pripada aktualnemu tednu
      const token = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      const direct = `${ATRIO_SOURCE_URL}?_cb=${encodeURIComponent(token)}`;

      const sources = [
        {
          name:"allorigins",
          timeoutMs:8000,
          url:`${ALLORIGINS_RAW_URL}${encodeURIComponent(direct)}&_cb=${encodeURIComponent(token)}`
        },
        {
          name:"codetabs",
          timeoutMs:8000,
          url:`${CODETABS_PROXY_URL}${encodeURIComponent(direct)}`
        },
        {
          name:"jina",
          timeoutMs:9000,
          url:`${JINA_READER_URL}${direct}`
        }
      ];

      try{
        const valid = await Promise.any(
          sources.map(async source => {
            const raw = await fetchTextWithRetry(source.url, {
              retries:0,
              timeoutMs:source.timeoutMs
            });

            const data = parseAtrio(raw);
            const week = atrioSourceWeekTs(raw);

            if (countItems(data) <= 0 || !week.currentWeek){
              throw new Error(`${source.name}: vir ne vsebuje potrjenega aktualnega tedna.`);
            }

            return { data, week, source:source.name };
          })
        );

        // Takoj uporabi prvi potrjen aktualni meni.
        return { data:valid.data, source:valid.source };
      }catch(error){
        throw new Error("Aktualnega Atrio menija trenutno ni mogoče potrditi.");
      }
    }

    function filtered(list){
      if (!globalQuery) return list || [];
      return (list || []).filter(d => {
        const blob = [d.title, d.price, ...(d.details || [])].join(" ");
        return includesQuery(blob, globalQuery);
      });
    }

    function section(title, items){
      const list = filtered(items);
      let html = `<div class="sectionHeader">${escapeHtml(title)}</div>`;
      html += list.length
        ? renderDishCardsHtml(list, { startIndex:1 })
        : `<p class="muted">${globalQuery ? "Ni zadetkov za iskanje." : "Ponudba ni na voljo."}</p>`;
      return html;
    }

    function render(){
      let html = "";
      html += section("Dnevna ponudba", parsed.lunchByDay?.[globalDayKey] || []);
      html += `<div style="height:10px"></div>`;
      html += section("Stalna ponudba", parsed.regular);
      html += `<div style="height:10px"></div>`;
      html += section("Zajtrk", parsed.breakfast);
      elBody.innerHTML = html;
    }

    const load = makeSingleFlight(async (force=false) => {
      setLoading(
        elBody,
        force
          ? "Preverjam aktualni Atrio meni…"
          : "Nalagam in preverjam aktualni Atrio meni…"
      );
      elStatus.textContent = "Preverjam aktualnost…";

      try{
        const verified = await fetchAtrio();
        parsed = verified.data;

        elStatus.textContent = "Aktualno";
        setUpdated(elUpdated, now(), verified.source);
        render();
      }catch(e){
        parsed = {
          breakfast: [],
          lunchByDay: { ponedeljek:[], torek:[], sreda:[], cetrtek:[], petek:[] },
          regular: []
        };

        setError(elBody, "Aktualnega menija trenutno ni mogoče potrditi.");
        elStatus.textContent = "Ni potrjeno";
        console.error(e);
      }
    });

    elRefresh.addEventListener("click", () => {
      withCooldown(elRefresh, CLICK_COOLDOWN_MS);
      load(true);
      toast("Osvežujem: Atrio 151");
    });

    return { load, render, refreshBtn:elRefresh };
  })();

  // ==============================
  // Global refresh + samodejno osveževanje
  // ==============================
  const refreshAllBtn = $("refreshAll");
  const globalStatus = $("globalStatus");
  let lastAutoRefresh = 0;
  let lastKnownDayKey = getDefaultDayKey();
  let globalRefreshInFlight = null;

  async function refreshAllMenus({ showToast=false, manual=false } = {}){
    // Prepreči dvojno osveževanje ob začetnem load/pageshow/visibility dogodkih.
    if (globalRefreshInFlight) return globalRefreshInFlight;

    // Čas zabeležimo že ob začetku, ne šele po koncu. S tem pageshow ne more
    // med počasnejšim Vinka klicem sprožiti še enega globalnega osveževanja.
    lastAutoRefresh = Date.now();

    globalRefreshInFlight = (async () => {
      const currentDayKey = getDefaultDayKey();
      if (currentDayKey !== lastKnownDayKey){
        lastKnownDayKey = currentDayKey;
        globalDayKey = currentDayKey;
        updateDayPill();
        setDayTags();
        renderDayChips();
      }

      globalStatus.textContent = "Osvežujem…";
      if (showToast) toast("Osvežujem vse menije…");

      await Promise.allSettled([
        femec.load(manual),
        vinka.load(manual),
        rotonda.load(manual),
        atrio.load(manual)
      ]);

      globalStatus.textContent = "Pripravljeno";
      if (showToast) toast("Končano");
    })();

    try{
      await globalRefreshInFlight;
    } finally {
      globalRefreshInFlight = null;
    }
  }

  refreshAllBtn.addEventListener("click", async () => {
    withCooldown(
      [refreshAllBtn, femec.refreshBtn, vinka.refreshBtn, rotonda.refreshBtn, atrio.refreshBtn],
      CLICK_COOLDOWN_MS
    );
    await refreshAllMenus({ showToast:true, manual:true });
  });

  // Ob vrnitvi na stran osveži samo, če je zadnje preverjanje starejše od 5 min.
  window.addEventListener("pageshow", () => {
    if (Date.now() - lastAutoRefresh > 5 * 60 * 1000) refreshAllMenus();
  });

  document.addEventListener("visibilitychange", () => {
    if (
      document.visibilityState === "visible" &&
      Date.now() - lastAutoRefresh > 5 * 60 * 1000
    ){
      refreshAllMenus();
    }
  });

  // Redno preverjanje je dovolj na 10 min. Ročni gumb ostane takojšen.
  setInterval(() => {
    if (document.visibilityState === "visible") refreshAllMenus();
  }, 10 * 60 * 1000);

  // ==============================
  // Init
  // ==============================
  updateDayPill();
  setDayTags();
  renderDayChips();
  refreshAllMenus();
})();
</script>
</body>
</html>
