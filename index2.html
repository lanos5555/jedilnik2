<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Malice – Femec, Vinka, Rotonda</title>

  <style>
    :root{
      --bg0:#0b1020;
      --bg1:#0d1630;
      --line: rgba(255,255,255,.10);
      --ink:#eef3ff;
      --muted: rgba(238,243,255,.72);

      --brand:#7c5cff;
      --brand2:#2ee5b2;
      --accent:#ffb020;
      --danger:#ff5c7a;

      --shadow: 0 22px 50px rgba(0,0,0,.35);
      --shadow2: 0 10px 22px rgba(0,0,0,.22);
      --radius: 20px;
      --radius2: 14px;

      --tap: 44px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color:var(--ink);
      background:
        radial-gradient(1200px 900px at 18% 0%, rgba(124,92,255,.24), transparent 60%),
        radial-gradient(1000px 700px at 90% 12%, rgba(46,229,178,.18), transparent 60%),
        radial-gradient(900px 700px at 30% 92%, rgba(255,176,32,.12), transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
      overflow-x:hidden;
    }

    .wrap{ max-width: 1220px; margin: 0 auto; padding: 18px 12px 34px; }

    /* ---------- Top bar ---------- */
    .topbar{
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(14px);
      background: linear-gradient(180deg, rgba(11,16,32,.82), rgba(11,16,32,.52));
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .topbarInner{
      max-width: 1220px;
      margin: 0 auto;
      padding: 14px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width: 0;
    }
    .logo{
      width:44px; height:44px;
      border-radius:14px;
      background: linear-gradient(135deg, var(--brand), rgba(46,229,178,.92));
      box-shadow: var(--shadow2);
      display:flex; align-items:center; justify-content:center;
      flex:0 0 auto;
      position:relative;
      overflow:hidden;
    }
    .logo:before{
      content:"";
      position:absolute; inset:-20px;
      background: radial-gradient(50% 50% at 30% 30%, rgba(255,255,255,.35), transparent 55%);
      transform: rotate(10deg);
    }
    .logo span{
      font-weight: 1000;
      letter-spacing:.5px;
      color:#061019;
      position:relative;
    }
    .titleBox{ min-width:0; }
    .titleBox h1{
      margin:0;
      font-size:1.15rem;
      letter-spacing:.2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .titleBox p{
      margin:4px 0 0;
      color:var(--muted);
      font-size:.92rem;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .actions{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: var(--muted);
      font-size:.9rem;
      max-width: 100%;
    }
    .pill b{
      color: rgba(238,243,255,.92);
      font-weight: 900;
    }

    .btn{
      cursor:pointer;
      border:0;
      border-radius:999px;
      height: var(--tap);
      padding: 0 14px;
      font-weight: 950;
      color: #061019;
      background: linear-gradient(135deg, rgba(124,92,255,1), rgba(46,229,178,.95));
      box-shadow: var(--shadow2);
      display:inline-flex;
      align-items:center;
      gap:10px;
    }
    .btn.secondary{
      background: rgba(255,255,255,.08);
      color: var(--ink);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: none;
    }
    .btn:disabled{ opacity:.55; cursor:not-allowed; }
    .btn:hover{ filter:brightness(1.03); }
    .btn.secondary:hover{ background: rgba(255,255,255,.10); }

    /* ---------- Hero (search + day chips) ---------- */
    .hero{
      margin-top: 14px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: calc(var(--radius) + 2px);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.04));
      box-shadow: var(--shadow);
      padding: 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 14px;
      flex-wrap:wrap;
      position:relative;
      overflow:hidden;
    }
    .hero:before{
      content:"";
      position:absolute;
      inset:-2px -2px auto -2px;
      height: 110px;
      background:
        radial-gradient(700px 160px at 20% 30%, rgba(124,92,255,.26), transparent 60%),
        radial-gradient(650px 140px at 80% 20%, rgba(46,229,178,.18), transparent 60%);
      pointer-events:none;
    }

    .heroLeft{
      position:relative;
      flex: 1 1 520px;
      min-width: 260px;
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      align-items:center;
    }

    .searchWrap{
      flex: 1 1 520px;
      min-width: 240px;
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(10px);
    }
    .searchIcon{
      width: 34px; height: 34px;
      border-radius: 12px;
      background: rgba(255,255,255,.10);
      display:flex; align-items:center; justify-content:center;
      font-size: 16px;
      flex: 0 0 auto;
    }
    .searchWrap input{
      width: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--ink);
      font-weight: 900;
      font-size: 1rem;
      letter-spacing: .1px;
    }
    .searchWrap input::placeholder{
      color: rgba(238,243,255,.55);
      font-weight: 800;
    }
    .clearBtn{
      cursor:pointer;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: rgba(238,243,255,.9);
      border-radius: 999px;
      height: 36px;
      padding: 0 10px;
      font-weight: 950;
      display:none;
      flex: 0 0 auto;
    }
    .clearBtn.show{ display:inline-flex; align-items:center; }

    .heroRight{
      position:relative;
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:flex-end;
      flex: 0 0 auto;
      flex-wrap:wrap;
    }

    .chips{
      display:flex; gap:8px; flex-wrap:wrap;
      justify-content:flex-end;
    }
    .chip{
      cursor:pointer;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: var(--ink);
      border-radius:999px;
      padding: 8px 12px;
      font-weight: 900;
      font-size: .92rem;
      user-select:none;
    }
    .chip.active{
      background: linear-gradient(135deg, rgba(124,92,255,.92), rgba(46,229,178,.92));
      color:#061019;
      border-color: transparent;
    }

    /* ---------- Layout ---------- */
    .grid{
      margin-top: 14px;
      display:grid;
      gap:14px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 980px){
      .grid{ grid-template-columns: 1fr 1fr; }
    }
    @media (min-width: 1280px){
      .grid{ grid-template-columns: 1fr 1fr 1fr; }
    }

    /* ---------- Restaurant card ---------- */
    .res{
      border: 1px solid rgba(255,255,255,.10);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.04));
      box-shadow: var(--shadow);
      overflow:hidden;
      min-width:0;
      display:flex;
      flex-direction:column;
    }
    .resHead{
      padding: 14px 14px 12px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 12px;
      position:relative;
      flex-wrap:wrap;
    }
    .resHead:before{
      content:"";
      position:absolute;
      inset:0 0 auto 0;
      height:4px;
      background: linear-gradient(90deg, rgba(124,92,255,.9), rgba(46,229,178,.85), rgba(255,176,32,.70));
    }
    .resName{
      margin:0;
      font-size: 1.15rem;
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 6px 10px;
      border-radius:999px;
      background: rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.12);
      color: var(--muted);
      font-size: .86rem;
      white-space:nowrap;
    }

    .meta{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:8px;
      min-width: 260px;
      flex: 1 1 260px;
    }
    .metaRow{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
      width: 100%;
    }
    .status{
      font-size:.92rem;
      color: var(--muted);
      padding: 8px 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      white-space:nowrap;
      min-width: 130px;
      text-align:center;
    }
    .updated{
      font-size:.88rem;
      color: rgba(238,243,255,.72);
      width: 100%;
      text-align:right;
      white-space:normal;
      overflow:visible;
    }

    .resBody{
      padding: 12px 14px 14px;
      display:grid;
      gap:12px;
    }

    .panel{
      border: 1px solid rgba(255,255,255,.10);
      border-radius: var(--radius2);
      background: rgba(255,255,255,.05);
      padding: 12px;
      min-width:0;
    }
    .panelTitle{
      margin: 0 0 10px;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }
    .panelTitle b{
      font-size: 1rem;
      letter-spacing:.2px;
    }

    /* bolj viden dan/desno */
    .dayTag{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.20);
      background:
        radial-gradient(220px 80px at 30% 30%, rgba(255,255,255,.14), transparent 55%),
        linear-gradient(135deg, rgba(124,92,255,.30), rgba(46,229,178,.18));
      color: rgba(238,243,255,.95);
      font-weight: 1000;
      letter-spacing: .2px;
      box-shadow: 0 12px 26px rgba(0,0,0,.22);
      white-space:nowrap;
    }
    .dayTag small{
      color: rgba(238,243,255,.78);
      font-weight: 900;
    }

    .dish{
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.06);
      border-radius: 14px;
      padding: 12px;
      margin: 10px 0;
      transition: transform .12s ease, background .12s ease;
    }
    .dish:hover{ transform: translateY(-1px); background: rgba(255,255,255,.08); }

    .dish h3{
      margin:0 0 6px;
      font-size: 1rem;
      display:flex;
      gap:10px;
      align-items:flex-start;
      line-height: 1.25;
    }
    .num{
      width: 26px; height: 26px;
      border-radius: 10px;
      background: rgba(255,255,255,.90);
      color:#061019;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-weight: 1000;
      flex:0 0 auto;
      font-size:.86rem;
    }
    .dish p{
      margin: 4px 0 0;
      color: rgba(238,243,255,.78);
      white-space: pre-line;
      line-height: 1.5;
    }

    .money, .price{
      font-weight: 1000;
      color: var(--accent);
      margin-left: 6px;
    }

    /* highlight search term */
    .hit{
      display:inline-block;
      padding: 0 .18em;
      border-radius: .35em;
      background: rgba(255,176,32,.22);
      border: 1px solid rgba(255,176,32,.35);
      color: rgba(255,240,210,.98);
      box-shadow: 0 6px 14px rgba(0,0,0,.18);
    }

    .muted{ color: var(--muted); margin:0; }
    .err{
      background: rgba(255,92,122,.12);
      border:1px solid rgba(255,92,122,.28);
      padding: 10px 12px;
      border-radius: 14px;
      color: rgba(255,220,228,.95);
    }

    .loader{
      display:flex;
      gap:10px;
      align-items:center;
      padding: 10px 0;
      color: var(--muted);
    }
    .dot{
      width:10px; height:10px;
      border-radius:50%;
      background: rgba(255,255,255,.55);
      animation: b 1s infinite ease-in-out;
    }
    .dot:nth-child(2){ animation-delay:.15s }
    .dot:nth-child(3){ animation-delay:.3s }
    @keyframes b{ 0%,100%{ transform:scale(.7); opacity:.5 } 50%{ transform:scale(1); opacity:1 } }

    /* ---------- Tiny toast ---------- */
    .toast{
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.14);
      color: rgba(238,243,255,.92);
      padding: 10px 12px;
      border-radius: 999px;
      box-shadow: var(--shadow2);
      backdrop-filter: blur(12px);
      font-weight: 900;
      display:none;
      max-width: calc(100vw - 24px);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .toast.show{ display:block; animation: pop .18s ease-out; }
    @keyframes pop{
      from{ transform: translateX(-50%) translateY(6px); opacity:.0 }
      to{ transform: translateX(-50%) translateY(0); opacity:1 }
    }

    @media (prefers-reduced-motion: reduce){
      *{ animation:none !important; transition:none !important; scroll-behavior:auto !important; }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="topbarInner">
      <div class="brand">
        <div class="logo" aria-hidden="true"><span>🍽️</span></div>
        <div class="titleBox">
          <h1>Malice na enem mestu</h1>
          <p>Femec · Vinka · Rotonda — hitro, pregledno, simpatično</p>
        </div>
      </div>

      <div class="actions">
        <span class="pill" id="todayPill">Dan: <b>—</b></span>
        <button class="btn" id="refreshAll" type="button">Osveži vse</button>
        <button class="btn secondary" id="scrollTop" type="button">Na vrh</button>
        <span class="pill" id="globalStatus">Pripravljeno</span>
      </div>
    </div>
  </div>

  <div class="wrap">
    <section class="hero" aria-label="Iskanje in izbira dneva">
      <div class="heroLeft">
        <div class="searchWrap" role="search" aria-label="Iskalnik jedi">
          <div class="searchIcon" aria-hidden="true">🔎</div>
          <input id="searchBox" type="search" placeholder="Išči jed (npr. golaž, burger, solata) …" autocomplete="off" />
          <button class="clearBtn" id="clearSearch" type="button" aria-label="Počisti iskanje">✕</button>
        </div>
      </div>

      <div class="heroRight">
        <div class="chips" id="dayChips" aria-label="Izbira dneva"></div>
      </div>
    </section>

    <main class="grid" role="main">
      <section class="res" id="femecWidget" aria-label="Femec">
        <div class="resHead">
          <div>
            <h2 class="resName">Femec <span class="badge">Malice: 11:00–14:00</span></h2>
          </div>
          <div class="meta">
            <div class="metaRow">
              <button class="btn secondary" id="refreshFemec" type="button">Osveži</button>
              <span class="status" id="statusFemec">Nalaganje…</span>
            </div>
            <span class="updated" id="updatedFemec" hidden></span>
          </div>
        </div>

        <div class="resBody">
          <div class="panel">
            <div class="panelTitle">
              <b>Meni</b>
              <span class="dayTag" id="femecDayTag">—</span>
            </div>
            <div id="femecBody"></div>
          </div>
        </div>
      </section>

      <section class="res" id="vinkaWidget" aria-label="Vinka">
        <div class="resHead">
          <div>
            <h2 class="resName">Vinka <span class="badge">Malice: 10:30–15:00</span></h2>
          </div>
          <div class="meta">
            <div class="metaRow">
              <button class="btn secondary" id="refreshVinka" type="button">Osveži</button>
              <span class="status" id="statusVinka">Nalaganje…</span>
            </div>
            <span class="updated" id="updatedVinka" hidden></span>
          </div>
        </div>

        <div class="resBody">
          <div class="panel">
            <div class="panelTitle">
              <b>Meni</b>
              <span class="dayTag" id="vinkaDayTag">—</span>
            </div>
            <div id="vinkaBody"></div>
          </div>
        </div>
      </section>

      <section class="res" id="rotondaWidget" aria-label="Rotonda – Bistro Chika">
        <div class="resHead">
          <div>
            <h2 class="resName">Rotonda – Bistro Chika <span class="badge">Tedenski meni</span></h2>
          </div>
          <div class="meta">
            <div class="metaRow">
              <button class="btn secondary" id="refreshRotonda" type="button">Osveži</button>
              <span class="status" id="statusRotonda">Nalaganje…</span>
            </div>
            <span class="updated" id="updatedRotonda" hidden></span>
          </div>
        </div>

        <div class="resBody">
          <div class="panel">
            <div class="panelTitle">
              <b>Meni</b>
              <span class="dayTag" id="rotondaDayTag">—</span>
            </div>
            <div id="rotondaBody"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const FEMEC_PROXY_URL   = "https://femec-proxy.lanos5555.workers.dev/api/femec";
  const VINKA_PROXY_URL   = "https://femec-proxy.lanos5555.workers.dev/api/vinka";
  const ROTONDA_PROXY_URL = "https://femec-proxy.lanos5555.workers.dev/api/rotonda";

  const FETCH_TIMEOUT_MS = 8500;

  const FEMEC_TIMEOUT_MS = 8500;
  const FEMEC_RETRIES = 1;

  const VINKA_TIMEOUT_MS = 8500;

  const ROTONDA_TIMEOUT_MS = 8500;
  const ROTONDA_RETRIES = 1;

  const CLICK_COOLDOWN_MS = 3500;

  const DAYS = [
    { key:"ponedeljek", label:"Ponedeljek" },
    { key:"torek",      label:"Torek" },
    { key:"sreda",      label:"Sreda" },
    { key:"cetrtek",    label:"Četrtek" },
    { key:"petek",      label:"Petek" },
  ];

  const DAY_EN_TO_SI = {
    MONDAY: "ponedeljek",
    TUESDAY: "torek",
    WEDNESDAY: "sreda",
    THURSDAY: "cetrtek",
    FRIDAY: "petek"
  };

  let globalDayKey = getDefaultDayKey();
  let globalQuery = "";

  const $ = (id) => document.getElementById(id);
  const now = () => Date.now();

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[m]));
  }

  function highlightMoney(text){
    const t = escapeHtml(text || "");
    const moneyRe =
      /(\b\d{1,4}(?:[.,]\d{2})?\s?(?:€|eur|EUR)\b|\b(?:€)\s?\d{1,4}(?:[.,]\d{2})?\b)/g;
    return t.replace(moneyRe, '<span class="money">$1</span>');
  }

  // Highlight search query inside already-escaped text (safe)
  function highlightQueryEscaped(escapedText, query){
    const q = (query || "").trim();
    if (!q) return escapedText;

    // allow multi words: highlight each token length>=2
    const tokens = q.split(/\s+/).map(t => t.trim()).filter(t => t.length >= 2);
    if (!tokens.length) return escapedText;

    let out = escapedText;
    for (const tok of tokens){
      const re = new RegExp(escapeRegExp(tok), "gi");
      out = out.replace(re, (m) => `<span class="hit">${m}</span>`);
    }
    return out;
  }
  function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

  // Combine: escape -> money highlight -> query highlight
  function decorateText(text){
    const escaped = escapeHtml(text || "");
    const money = highlightMoney(text || ""); // already escapes inside
    // highlightMoney returns HTML; ensure query highlight runs on that HTML but not breaking tags:
    // We'll apply highlight only to text nodes by doing a conservative replace on plain escaped parts.
    // Practical approach: run highlight on the money HTML string; tokens won't match inside tags anyway.
    return highlightQueryEscaped(money, globalQuery);
  }

  function setLoading(el, msg){
    el.innerHTML = `<div class="loader">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span>${escapeHtml(msg || "Nalaganje…")}</span>
    </div>`;
  }
  function setError(el, msg){
    el.innerHTML = `<div class="err">${escapeHtml(msg)}</div>`;
  }
  function setUpdated(el, ts){
    const d = new Date(ts);
    el.textContent = "Posodobljeno: " + d.toLocaleString("sl-SI", { dateStyle:"medium", timeStyle:"short" });
    el.hidden = false;
  }

  function getDefaultDayKey(){
    const d = new Date();
    const wd = d.getDay();
    if (wd >= 1 && wd <= 5) return DAYS[wd-1].key;
    return "ponedeljek";
  }

  function formatDateForDayKey(dayKey){
    const idxMap = { ponedeljek:1, torek:2, sreda:3, cetrtek:4, petek:5 };
    const idx = idxMap[dayKey] || 1;
    const d = new Date();
    let wd = d.getDay(); if (wd === 0) wd = 7;
    const monday = new Date(d); monday.setDate(d.getDate() - (wd-1));
    const target = new Date(monday); target.setDate(monday.getDate() + (idx-1));
    return target.toLocaleDateString("sl-SI", { day:"numeric", month:"long" });
  }

  function withCooldown(buttons, ms){
    const list = Array.isArray(buttons) ? buttons : [buttons];
    list.forEach(b => { if (b) b.disabled = true; });
    setTimeout(() => list.forEach(b => { if (b) b.disabled = false; }), ms);
  }

  function makeSingleFlight(loader){
    let inflight = null;
    return async (...args) => {
      if (inflight) return inflight;
      inflight = (async () => {
        try { return await loader(...args); }
        finally { inflight = null; }
      })();
      return inflight;
    };
  }

  async function fetchTextWithTimeout(url, timeoutMs){
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeoutMs ?? FETCH_TIMEOUT_MS);
    try{
      const resp = await fetch(url, { signal: ctrl.signal, headers:{ "Accept":"text/html,*/*" } });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      return await resp.text();
    } finally { clearTimeout(t); }
  }

  async function fetchTextWithRetry(url, { retries = 0, timeoutMs = FETCH_TIMEOUT_MS } = {}){
    let last;
    for (let i=0; i<=retries; i++){
      try { return await fetchTextWithTimeout(url, timeoutMs); }
      catch(e){ last = e; if (i < retries) await new Promise(r => setTimeout(r, 300*(i+1))); }
    }
    throw last;
  }

  function norm(s){ return String(s || "").toLowerCase().trim(); }
  function includesQuery(text, q){
    if (!q) return true;
    return norm(text).includes(norm(q));
  }

  // ---------- Toast ----------
  const toastEl = $("toast");
  let toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2000);
  }

  // ---------- Top status + scroll top ----------
  const todayPill = $("todayPill");
  function updateDayPill(){
    const label = DAYS.find(x => x.key === globalDayKey)?.label || globalDayKey;
    todayPill.innerHTML = `Dan: <b>${escapeHtml(label)} · ${escapeHtml(formatDateForDayKey(globalDayKey))}</b>`;
  }
  $("scrollTop").addEventListener("click", () => window.scrollTo({ top:0, behavior:"smooth" }));

  // ---------- Day tags in panels ----------
  function setDayTags(){
    const label = DAYS.find(x => x.key === globalDayKey)?.label || globalDayKey;
    const date = formatDateForDayKey(globalDayKey);
    const tagHtml = `${escapeHtml(label)} <small>· ${escapeHtml(date)}</small>`;
    $("femecDayTag").innerHTML = tagHtml;
    $("vinkaDayTag").innerHTML = tagHtml;
    $("rotondaDayTag").innerHTML = tagHtml;
  }

  // ---------- Day chips ----------
  const dayChips = $("dayChips");
  function renderDayChips(){
    dayChips.innerHTML = "";
    for (const d of DAYS){
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip" + (d.key === globalDayKey ? " active" : "");
      b.textContent = d.label;
      b.onclick = () => {
        globalDayKey = d.key;
        Array.from(dayChips.querySelectorAll(".chip")).forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        updateDayPill();
        setDayTags();
        femec.render();
        vinka.render();
        rotonda.render();
        toast("Izbran dan: " + d.label);
      };
      dayChips.appendChild(b);
    }
  }

  // ---------- Search ----------
  const searchBox = $("searchBox");
  const clearSearch = $("clearSearch");
  function applySearch(q){
    globalQuery = (q || "").trim();
    clearSearch.classList.toggle("show", !!globalQuery);
    femec.render();
    vinka.render();
    rotonda.render();
  }
  searchBox.addEventListener("input", (e) => applySearch(e.target.value || ""));
  clearSearch.addEventListener("click", () => {
    searchBox.value = "";
    applySearch("");
    searchBox.focus();
  });

  // ==============================
  // Render helper
  // ==============================
  function renderDishList(el, list, { titleKey="name", detailsKey="sides", showIndex=true, priceKey=null } = {}){
    if (!list || !list.length){
      el.innerHTML = globalQuery
        ? `<p class="muted">Ni zadetkov za iskanje.</p>`
        : `<p class="muted">Meni še ni na voljo.</p>`;
      return;
    }

    el.innerHTML = list.map((d, idx) => {
      const title = d[titleKey] || "";
      const details = d[detailsKey] || [];
      const price = priceKey ? (d[priceKey] || "") : "";
      const num = showIndex ? (idx+1) : (d.num || "");

      const detailText = Array.isArray(details) ? details.join("\n") : String(details || "");
      return `
        <div class="dish">
          <h3>
            <span class="num">${escapeHtml(String(num))}</span>
            <span>${decorateText(title)}</span>
            ${price ? `<span class="price">(${decorateText(price)})</span>` : ""}
          </h3>
          ${detailText ? `<p>${decorateText(detailText)}</p>` : ""}
        </div>
      `;
    }).join("");
  }

  // ==============================
  // FEMEC
  // ==============================
  const femec = (() => {
    const elStatus = $("statusFemec");
    const elUpdated = $("updatedFemec");
    const elRefresh = $("refreshFemec");
    const elBody = $("femecBody");

    let parsed = null;

    function parseFemecMenu(html){
      const doc = new DOMParser().parseFromString(html, "text/html");
      const root = doc.querySelector("#wholemenu") || doc;
      const out = {};
      for (const d of DAYS){
        const sec = root.querySelector(`#${d.key}`) || doc.getElementById(d.key);
        if (!sec) { out[d.key] = []; continue; }

        const lines = Array.from(sec.querySelectorAll(".menuline"));
        out[d.key] = lines.map(line => {
          const num = (line.querySelector(".menunumber")?.textContent || "").trim();
          const ps = Array.from(line.querySelectorAll(".menucontent p"))
            .map(p => p.textContent.replace(/\u00a0/g," ").trim())
            .filter(Boolean);
          if (!ps.length) return null;
          const name = ps[0].replace(/\s+/g," ").trim();
          const sides = ps.slice(1);
          return { num, name, sides };
        }).filter(Boolean);
      }
      return out;
    }

    function filterForQuery(list){
      if (!globalQuery) return list;
      return (list || []).filter(d => {
        const blob = [
          d.num, d.name,
          Array.isArray(d.sides) ? d.sides.join(" ") : d.sides
        ].join(" ");
        return includesQuery(blob, globalQuery);
      });
    }

    function render(){
      const listRaw = parsed?.[globalDayKey] || [];
      const list = filterForQuery(listRaw);
      renderDishList(elBody, list.map(x => ({ name: x.name, sides: x.sides })), { titleKey:"name", detailsKey:"sides", showIndex:true });
    }

    const load = makeSingleFlight(async (force=false) => {
      setLoading(elBody, force ? "Osvežujem Femec…" : "Nalagam Femec…");
      elStatus.textContent = force ? "Osvežujem…" : "Nalaganje…";

      try {
        const html = await fetchTextWithRetry(FEMEC_PROXY_URL, { retries: FEMEC_RETRIES, timeoutMs: FEMEC_TIMEOUT_MS });
        parsed = parseFemecMenu(html);
        elStatus.textContent = "Posodobljeno";
        setUpdated(elUpdated, now());
        render();
      } catch (e) {
        setError(elBody, "Femec meni ni dosegljiv.");
        elStatus.textContent = "Napaka";
        console.error(e);
      }
    });

    elRefresh.addEventListener("click", () => {
      withCooldown(elRefresh, CLICK_COOLDOWN_MS);
      load(true);
      toast("Osvežujem: Femec");
    });

    return { load, render, refreshBtn: elRefresh };
  })();

  // ==============================
  // VINKA: samo današnji meni (ali cache za preteklost); prihodnost -> “Meni še ni na voljo.”
  // ==============================
  const vinka = (() => {
    const elStatus = $("statusVinka");
    const elUpdated = $("updatedVinka");
    const elRefresh = $("refreshVinka");
    const elBody = $("vinkaBody");

    let vinkaData = null;
    let lastGoodTs = 0;

    function cleanHtmlToText(htmlSnippet){
      return htmlSnippet
        .replace(/<br\s*\/?>/gi, "\n")
        .replace(/<[^>]+>/g, "")
        .replace(/\u00a0/g, " ")
        .trim();
    }

    function parseVinka(html){
      const doc = new DOMParser().parseFromString(html, "text/html");
      const content = doc.querySelector('div.col-md-9[role="content"]');
      if (!content) return { ok:false, dailyLines:[], regularLines:[], msg:"Glavni vsebinski del ni bil najden." };

      let pWithMenu = null;
      for (const p of Array.from(content.querySelectorAll("p"))) {
        const t = (p.innerText || "").toLowerCase();
        if (t.includes("dnevna ponudba") && (t.includes("naše stalnice") || t.includes("jed na žlico") || t.includes("za vegeterijance") || t.includes("za vegetarijance"))) {
          pWithMenu = p; break;
        }
      }
      if (!pWithMenu) return { ok:false, dailyLines:[], regularLines:[], msg:"Vsebina menija ni v pričakovani obliki." };

      const htmlContent = pWithMenu.innerHTML;

      const mStal = "Naše stalnice:";
      const mDnev = "Dnevna ponudba:";
      const mVeg1 = "Za vegeterijance:";
      const mVeg2 = "Za vegetarijance:";
      const mZlic = "Jed na žlico:";

      const iS = htmlContent.indexOf(mStal);
      const iD = htmlContent.indexOf(mDnev);
      const iV1 = htmlContent.indexOf(mVeg1);
      const iV2 = htmlContent.indexOf(mVeg2);
      const iV = (iV1 !== -1) ? iV1 : iV2;
      const iZ = htmlContent.indexOf(mZlic);

      let dailyText = "";
      let regularText = "";

      if (iS === -1 || iD === -1) {
        dailyText = cleanHtmlToText(htmlContent);
        regularText = "";
      } else {
        const dailyEnd = (iV !== -1) ? iV : ((iZ !== -1) ? iZ : htmlContent.length);
        dailyText = cleanHtmlToText(htmlContent.substring(iD + mDnev.length, dailyEnd));
        regularText = cleanHtmlToText(htmlContent.substring(iS + mStal.length, iD));
      }

      const dailyLines = dailyText ? dailyText.split("\n").map(s => s.trim()).filter(Boolean) : [];
      const regularLines = regularText ? regularText.split("\n").map(s => s.trim()).filter(Boolean) : [];
      return { ok:true, dailyLines, regularLines, msg:"" };
    }

    function startOfDay(ts){
      const d = new Date(ts);
      d.setHours(0,0,0,0);
      return d.getTime();
    }

    // Selected day belongs to this week (Mon–Fri) -> compute date and compare
    function isFutureSelectedDay(){
      const idxMap = { ponedeljek:1, torek:2, sreda:3, cetrtek:4, petek:5 };
      const idx = idxMap[globalDayKey] || 1;

      const d = new Date();
      let wd = d.getDay(); if (wd === 0) wd = 7;
      const monday = new Date(d); monday.setDate(d.getDate() - (wd-1));
      const target = new Date(monday); target.setDate(monday.getDate() + (idx-1));

      return startOfDay(target.getTime()) > startOfDay(Date.now());
    }

    function isTodaySelectedDay(){
      const idxMap = { ponedeljek:1, torek:2, sreda:3, cetrtek:4, petek:5 };
      const idx = idxMap[globalDayKey] || 1;

      const d = new Date();
      let wd = d.getDay(); if (wd === 0) wd = 7;
      const monday = new Date(d); monday.setDate(d.getDate() - (wd-1));
      const target = new Date(monday); target.setDate(monday.getDate() + (idx-1));

      return startOfDay(target.getTime()) === startOfDay(Date.now());
    }

    function filterLines(lines){
      if (!globalQuery) return lines || [];
      return (lines || []).filter(line => includesQuery(line, globalQuery));
    }

    function render(){
      // Future selected day => no menu
      if (isFutureSelectedDay()){
        elBody.innerHTML = `<p class="muted">Meni še ni na voljo.</p>`;
        return;
      }

      // For past days: allow cached view; for today: show live/cached data
      if (!vinkaData){
        elBody.innerHTML = `<p class="muted">Meni še ni na voljo.</p>`;
        return;
      }

      // If selected day is past, keep cached (ok). If today, show.
      // (Vinka has only current day; we use cache for “prejšnji dan” view.)

      const daily = filterLines(vinkaData.dailyLines);
      const regular = filterLines(vinkaData.regularLines);

      const blocks = [];

      if (daily.length){
        blocks.push(`
          <div class="dish" style="background:rgba(255,255,255,.07);">
            <h3><span class="num">★</span> ${escapeHtml("Dnevna ponudba")}</h3>
          </div>
          ${daily.map((line, idx) => `
            <div class="dish">
              <h3><span class="num">${idx+1}</span> ${decorateText(line)}</h3>
            </div>
          `).join("")}
        `);
      }

      if (regular.length){
        blocks.push(`
          <div class="dish" style="background:rgba(255,255,255,.07);">
            <h3><span class="num">★</span> ${escapeHtml("Redna ponudba (stalnice)")}</h3>
          </div>
          ${regular.map((line, idx) => `
            <div class="dish">
              <h3><span class="num">${idx+1}</span> ${decorateText(line)}</h3>
            </div>
          `).join("")}
        `);
      }

      if (!blocks.length){
        elBody.innerHTML = globalQuery
          ? `<p class="muted">Ni zadetkov za iskanje.</p>`
          : `<p class="muted">Meni še ni na voljo.</p>`;
        return;
      }

      elBody.innerHTML = blocks.join("");
    }

    const load = makeSingleFlight(async (force=false) => {
      // Only attempt fetch if today is selected or we are doing global refresh.
      // If user selects future day, we won't fetch anyway (render handles it),
      // but fetch is harmless; still keep behavior simple.
      setLoading(elBody, force ? "Osvežujem Vinka…" : "Nalagam Vinka…");
      elStatus.textContent = force ? "Osvežujem…" : "Nalaganje…";

      const url = VINKA_PROXY_URL + "?_=" + Date.now();

      const tryOnce = async () => {
        const html = await fetchTextWithRetry(url, { retries: 0, timeoutMs: VINKA_TIMEOUT_MS });
        const p = parseVinka(html);
        if (!p.ok) throw new Error(p.msg || "Parse fail");

        vinkaData = { dailyLines: p.dailyLines, regularLines: p.regularLines };
        lastGoodTs = Date.now();

        localStorage.setItem("vinka:data", JSON.stringify(vinkaData));
        localStorage.setItem("vinka:lastGoodTs", String(lastGoodTs));

        elStatus.textContent = "Posodobljeno";
        setUpdated(elUpdated, lastGoodTs);
        render();
      };

      const waits = [0, 800, 2000];
      for (let i = 0; i < waits.length; i++) {
        try {
          if (waits[i]) await new Promise(r => setTimeout(r, waits[i]));
          await tryOnce();
          return;
        } catch (e) {}
      }

      const cached = localStorage.getItem("vinka:data");
      const ts = Number(localStorage.getItem("vinka:lastGoodTs") || 0);
      if (cached) {
        try{
          vinkaData = JSON.parse(cached);
          lastGoodTs = ts || 0;
          elStatus.textContent = "Zadnji uspešen meni";
          setUpdated(elUpdated, lastGoodTs || now());
          render();
          return;
        } catch(e){}
      }

      setError(elBody, "Vinka meni ni dosegljiv (napaka pri nalaganju).");
      elStatus.textContent = "Napaka";
    });

    elRefresh.addEventListener("click", () => {
      withCooldown(elRefresh, CLICK_COOLDOWN_MS);
      load(true);
      toast("Osvežujem: Vinka");
    });

    // init from cache
    (() => {
      const cached = localStorage.getItem("vinka:data");
      const ts = Number(localStorage.getItem("vinka:lastGoodTs") || 0);
      if (cached) {
        try{
          vinkaData = JSON.parse(cached);
          lastGoodTs = ts || 0;
          elStatus.textContent = "Zadnji uspešen meni";
          setUpdated(elUpdated, lastGoodTs || now());
        } catch(e){}
      }
      render();
    })();

    return { load, render, refreshBtn: elRefresh };
  })();

  // ==============================
  // ROTONDA
  // ==============================
  const rotonda = (() => {
    const elStatus = $("statusRotonda");
    const elUpdated = $("updatedRotonda");
    const elRefresh = $("refreshRotonda");
    const elBody = $("rotondaBody");

    let weekRange = "";
    let parsedByDay = null;

    function normalizeLines(text){
      const fixed = (text || "")
        .replace(/\u00a0/g, " ")
        .replace(/Weekly menu\s*(\d)/gi, "Weekly menu\n$1")
        .replace(/(MONDAY|TUESDAY|WEDNESDAY|THURSDAY|FRIDAY)\s*(\/)\s*(MONDAY|TUESDAY|WEDNESDAY|THURSDAY|FRIDAY)/gi, "$1 / $3");
      return fixed
        .split("\n")
        .map(s => s.replace(/\s+/g, " ").trim())
        .filter(Boolean);
    }

    function canonicalDayLine(line){
      return (line || "").replace(/[^A-Za-z/ ]/g, "").replace(/\s+/g, " ").trim().toUpperCase();
    }
    function isDayHeadingLine(line){
      const s = canonicalDayLine(line);
      return /^(MONDAY|TUESDAY|WEDNESDAY|THURSDAY|FRIDAY)(\s*\/\s*(MONDAY|TUESDAY|WEDNESDAY|THURSDAY|FRIDAY))*$/.test(s);
    }
    function dayHeadingToKeys(line){
      const s = canonicalDayLine(line);
      const parts = s.split("/").map(x => x.trim()).filter(Boolean);
      return parts.map(p => DAY_EN_TO_SI[p]).filter(Boolean);
    }
    function looksLikePrice(s){ return /^€\s*\d/.test(s) || /^€\d/.test(s); }
    function looksLikeWeekRange(s){ return /^\d{1,2}\s*-\s*\d{1,2}\s+[A-Za-z]/.test(s); }
    function isJunkTitle(s){
      const t = (s || "").trim();
      if (!t) return true;
      if (t === "/" || t === "-" || t === "—") return true;
      if (!/[A-Za-zÀ-ž]/.test(t)) return true;
      const low = t.toLowerCase();
      if (low.startsWith("with ")) return true;
      if (low.startsWith("optional")) return true;
      if (low === "side salad" || low === "with side salad") return true;
      return false;
    }

    function parseRotonda(html){
      const doc = new DOMParser().parseFromString(html, "text/html");
      const fullText = doc.body ? (doc.body.innerText || doc.body.textContent || "") : (doc.documentElement?.textContent || "");
      const lines = normalizeLines(fullText);

      const startIdx = lines.findIndex(l => l.toLowerCase() === "weekly menu");
      const endIdx = lines.findIndex(l => l.toLowerCase() === "subscribe");
      const slice = (startIdx !== -1)
        ? lines.slice(startIdx + 1, endIdx !== -1 ? endIdx : lines.length)
        : lines;

      let range = "";
      if (slice.length && looksLikeWeekRange(slice[0])) range = slice[0];

      const out = { ponedeljek:[], torek:[], sreda:[], cetrtek:[], petek:[] };
      let activeDays = [];
      let i = (range ? 1 : 0);

      while (i < slice.length){
        const line = slice[i];

        if (isDayHeadingLine(line)) { activeDays = dayHeadingToKeys(line); i++; continue; }
        if (!activeDays.length) { i++; continue; }

        if (looksLikePrice(line)) {
          let price = line.trim();
          i++;

          while (i < slice.length && looksLikePrice(slice[i])) {
            const p2 = slice[i].trim();
            if (p2 !== price && !price.includes(p2)) price = price + " / " + p2;
            i++;
          }

          let title = "";
          while (i < slice.length) {
            const cand = slice[i];
            if (isDayHeadingLine(cand) || looksLikePrice(cand)) break;
            if (isJunkTitle(cand)) { i++; continue; }
            title = cand.trim();
            i++;
            break;
          }

          const details = [];
          while (i < slice.length) {
            const nxt = slice[i];
            if (isDayHeadingLine(nxt) || looksLikePrice(nxt)) break;
            const t = nxt.trim();
            if (t && t !== "/" && t !== "-" && t !== "—") details.push(t);
            i++;
          }

          if (!title || isJunkTitle(title)) continue;

          const dish = { title, price, details };
          for (const dk of activeDays) out[dk].push(dish);
          continue;
        }
        i++;
      }

      return { range, out };
    }

    function filterForQuery(list){
      if (!globalQuery) return list;
      return (list || []).filter(d => {
        const blob = [
          d.title, d.price,
          Array.isArray(d.details) ? d.details.join(" ") : d.details
        ].join(" ");
        return includesQuery(blob, globalQuery);
      });
    }

    function render(){
      const listRaw = parsedByDay?.[globalDayKey] || [];
      const list = filterForQuery(listRaw);
      renderDishList(elBody, list, { titleKey:"title", detailsKey:"details", showIndex:true, priceKey:"price" });
    }

    const load = makeSingleFlight(async (force=false) => {
      setLoading(elBody, force ? "Osvežujem Rotonda…" : "Nalagam Rotonda…");
      elStatus.textContent = force ? "Osvežujem…" : "Nalaganje…";

      try{
        const html = await fetchTextWithRetry(ROTONDA_PROXY_URL, { retries: ROTONDA_RETRIES, timeoutMs: ROTONDA_TIMEOUT_MS });
        const p = parseRotonda(html);
        weekRange = p.range || "";
        parsedByDay = p.out || null;

        elStatus.textContent = "Posodobljeno";
        setUpdated(elUpdated, now());
        render();
      } catch(e){
        setError(elBody, "Rotonda meni ni dosegljiv.");
        elStatus.textContent = "Napaka";
        console.error(e);
      }
    });

    elRefresh.addEventListener("click", () => {
      withCooldown(elRefresh, CLICK_COOLDOWN_MS);
      load(true);
      toast("Osvežujem: Rotonda");
    });

    return { load, render, refreshBtn: elRefresh };
  })();

  // ==============================
  // Global refresh
  // ==============================
  const refreshAllBtn = $("refreshAll");
  const globalStatus = $("globalStatus");

  refreshAllBtn.addEventListener("click", async () => {
    withCooldown([refreshAllBtn, femec.refreshBtn, vinka.refreshBtn, rotonda.refreshBtn], CLICK_COOLDOWN_MS);
    globalStatus.textContent = "Osvežujem…";
    toast("Osvežujem vse menije…");

    await Promise.allSettled([
      femec.load(true),
      vinka.load(true),
      rotonda.load(true),
    ]);

    globalStatus.textContent = "Pripravljeno";
    toast("Končano ✅");
  });

  // ==============================
  // Init
  // ==============================
  updateDayPill();
  setDayTags();
  renderDayChips();

  femec.load(false);
  vinka.load(false);
  rotonda.load(false);

  femec.render();
  vinka.render();
  rotonda.render();
})();
</script>
</body>
